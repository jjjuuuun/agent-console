# 예제 확장: 상호작용 종류(X15) + 그 종류를 허용하는 연결 종류(X2). uv workspace 멤버가 아니다.
[project]
name = "agent-console-example-interactions"
version = "0.1.0"
description = "Agent Console 예제 확장 — 서명 받기 상호작용 종류(example.sign_off)와 허용 연결"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.12,<0.13",
    "agent-console-runtime>=0.1,<0.2",
]

# 상호작용 종류는 디스크립터 객체 하나로 등록한다(코드 없음). 그룹 이름 =
# agent_console_runtime.INTERACTION_KINDS_GROUP. 이 종류를 열 수 있게 하는 것은 연결 종류의
# `interaction.kinds`이므로 허용 연결도 함께 등록한다(그룹 = EDGE_TYPES_GROUP).
[project.entry-points."agent_console.interaction_kinds"]
"example.sign_off" = "agent_console_example_interactions:SIGN_OFF"

[project.entry-points."agent_console.edge_types"]
"example.ask_sign_off" = "agent_console_example_interactions:AskSignOffEdge"

# 개발 의존: 테스트가 팀 의미 계산(agent_console_teams)으로 등록 결과를 확인한다.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "agent-console-teams>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 예제는 워크스페이스에 설치하지 않고 검사한다(entry point를 알리지 않아 서버 테스트 결과가 그대로). 패키지 안 경로다.
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
