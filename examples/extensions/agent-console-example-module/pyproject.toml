# 예제 확장: 서버 모듈 하나(X20) + 마이그레이션 계보 범위(X39) + 정의 종류 기여(X44).
# uv workspace 멤버가 아니다 — 따로 설치·제거한다.
[project]
name = "agent-console-example-module"
version = "0.1.0"
description = "Agent Console 예제 확장 — 짧은 노트를 적고 읽는 서버 모듈(mod-example-notes)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

# 등록은 이 표 하나로 끝난다. 그룹 이름 = agent_console_modkit.MODULES_GROUP,
# entry point 이름 = 모듈 id(설정 `modules.options.<id>`·`modules.disabled`가 이 이름을 쓴다).
# 값은 `descriptor`와 `build(ctx)`를 가진 모듈 객체.
[project.entry-points."agent_console.server_modules"]
mod-example-notes = "agent_console_example_module.module:module"

# 이 예제가 보이는 확장 지점(slug는 확장 지점 선언과 맞춘다).
[tool.agent-console.example]
points = ["server-module", "migration-scope", "definition-kind-contribution"]

# 개발 의존: 테스트가 테스트 호스트(modkit)와 통합 서버(agent-console-server — 기본 모듈 전부)를 조립한다.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-server>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 예제는 워크스페이스에 설치하지 않고 검사한다(entry point를 알리지 않아 서버 테스트 결과가 그대로). 패키지 안 경로다.
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
