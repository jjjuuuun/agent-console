# 예제 확장: 스펙(SDD) 검증 결과 출처 플러그인 하나(X42). uv workspace 멤버가 아니다 — 따로 설치·제거한다.
[project]
name = "agent-console-example-sdd-junit"
version = "0.1.0"
description = "Agent Console 예제 확장 — JUnit XML 테스트 결과를 스펙 추적 표에 넣는 검증 결과 출처(example.junit)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-sdd>=0.1,<0.2",
    "agent-console-safe-regex>=0.1,<0.2",
    "pydantic>=2.9",
]

# 등록은 이 표 하나로 끝난다. 그룹 이름 = agent_console_mod_sdd.plugins.VERIFICATION_SOURCES_GROUP,
# entry point 이름 = 출처 id(= 사용자 설정 `sdd.verification_sources[].id`). 값은 인자 없이 부르는 클래스.
[project.entry-points."agent_console.sdd_verification_sources"]
"example.junit" = "agent_console_example_sdd_junit:JUnitVerificationSource"

# 이 예제가 보이는 확장 지점(slug는 확장 지점 선언과 맞춘다).
[tool.agent-console.example]
points = ["sdd-verification-source"]

# 개발 의존: 테스트가 스펙 서버 모듈(mod-sdd)을 조립해 추적 표에 결과가 들어가는지 확인한다.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-mod-sdd>=0.1,<0.2",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 예제는 워크스페이스에 설치하지 않고 검사한다(entry point를 알리지 않아 서버 테스트 결과가 그대로). 패키지 안 경로다.
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
