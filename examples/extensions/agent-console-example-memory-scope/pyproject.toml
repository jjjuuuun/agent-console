# 예제 확장: 메모리 계산 범위 종류 플러그인 하나(X29). uv workspace 멤버가 아니다 — 따로 설치·제거한다.
[project]
name = "agent-console-example-memory-scope"
version = "0.1.0"
description = "Agent Console 예제 확장 — 메모리 계산 범위 종류 플러그인(ISO 주차)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.10,<0.11",
    "agent-console-memory>=0.1,<0.2",
]

# 그룹 이름 = agent_console_memory.MEMORY_SCOPE_KINDS_GROUP. 대상은 인자 없는 함수 → MemoryScopeKind 목록.
# entry point 이름은 레지스트리 key이고 설정 `plugins.enabled`가 이 이름으로 고른다.
# 화면의 출처 이름은 배포 이름(`plugin:agent-console-example-memory-scope`)이다.
[project.entry-points."agent_console.memory_scope_kinds"]
"example.memory_scope" = "agent_console_example_memory_scope:scope_kinds"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "agent-console-mod-memory>=0.1,<0.2",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 예제는 워크스페이스에 설치하지 않고 검사한다(entry point를 알리지 않아 서버 테스트 결과가 그대로). 패키지 안 경로다.
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
