# 예제 확장: 노드 타입 플러그인 하나(X1). uv workspace 멤버가 아니다 — 따로 설치·제거한다.
[project]
name = "agent-console-example-nodes"
version = "0.1.0"
description = "Agent Console 예제 확장 — 텍스트 변환 노드 타입(example.text_transform)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.12,<0.13",
    "agent-console-runtime>=0.1,<0.2",
    "pydantic>=2.9",
]

# 엔진 등록은 이 표 하나로 끝난다. 그룹 이름 = agent_console_runtime.NODE_TYPES_GROUP,
# entry point 이름 = 레지스트리 key = 디스크립터 id.
[project.entry-points."agent_console.node_types"]
"example.text_transform" = "agent_console_example_nodes:TextTransformNode"

# 개발 의존: 테스트가 팀 의미 계산(agent_console_teams)으로 등록 결과를 확인한다.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "agent-console-teams>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 예제는 워크스페이스에 설치하지 않고 검사한다(entry point를 알리지 않아 서버 테스트 결과가 그대로). 패키지 안 경로다.
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
