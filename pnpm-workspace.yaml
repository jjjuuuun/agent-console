packages:
  - "packages/ts/config/*"
  - "packages/ts/lib/*"
  - "apps/web"

# 사내 패키지 의존은 일반 버전 범위(^x.y.z)로 적고, 범위에 맞는 워크스페이스 패키지가 있으면 연결한다.
# (패키지를 저장소 밖으로 복사해도 package.json을 고치지 않고 tarball/레지스트리로 설치된다 - design 3R.2)
linkWorkspacePackages: true

# 보안 패치(GHSA-w74x-v6f9-j3xg 등): 전이 의존 fast-uri가 범위 안 갱신으로 안 올라와 고친 버전으로 고정한다.
overrides:
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"
  "fast-uri@>=4.0.0 <4.2.3": "^4.2.3"
