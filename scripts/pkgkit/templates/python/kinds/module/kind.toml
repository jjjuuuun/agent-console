# Feature module (L3): plugs one feature library into the server. Run it standalone with `python -m <import> --check` (modularity §3.9.4).
# module.py and __main__.py follow the modkit public API (3R.8). Standalone runs need a host, so it depends on modkit[host].
folder = "modules"
description = "{{product_name}} feature module"
dependencies = ["{{dist_prefix}}contracts", "{{dist_prefix}}modkit[host]"]
dev_dependencies = []
required_files = ["src/{{import_name}}/__main__.py", "src/{{import_name}}/module.py"]
runnable = true
# Module id = folder name without the folder prefix (ac-) and this prefix (`ac-mod-chat` → `chat`). Override it with --id.
id_prefix = "mod-"

[entry_points."{{modules_group}}"]
"{{module_id}}" = "{{import_name}}.module:module"
