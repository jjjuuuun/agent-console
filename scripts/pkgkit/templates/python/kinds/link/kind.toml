# Link module (L4): connects the public ports of two feature modules. Run it standalone together with both modules via `--with` (modularity §3.9.4).
folder = "links"
description = "{{product_name}} link module"
dependencies = ["{{dist_prefix}}contracts", "{{dist_prefix}}modkit[host]"]
dev_dependencies = []
required_files = ["src/{{import_name}}/__main__.py", "src/{{import_name}}/module.py"]
runnable = true
# Module id = folder name without the folder prefix (ac-) and this prefix (`ac-link-chat` → `chat`). Override it with --id.
id_prefix = "link-"

[entry_points."{{modules_group}}"]
"{{module_id}}" = "{{import_name}}.module:module"
