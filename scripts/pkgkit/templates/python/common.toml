# Required files common to every Python package (pkg-lint `required-files`). The `{{import_name}}` placeholder is allowed.
# Extra files per kind go in required_files of kinds/<kind>/kind.toml.
required_files = [
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "src/{{import_name}}/__init__.py",
    "src/{{import_name}}/py.typed",
    "tests",
]

# Development tools added to every package's dev group (same lower bounds as the root dev group)
dev_dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]
