# i18n 검사·뽑기 설정(`uv run poe i18n-check` · `uv run poe i18n-extract --lang <code>`, design §I18N.10 S1~S3).
# 경로는 저장소 루트 기준. 이 파일만 고치면 대상·제외·심각도를 바꿀 수 있다(README "설정").

# 검사·뽑기 대상 패키지 폴더(glob). 폴더 이름이 패키지 이름(`--package`)이고 entry point 이름이다.
targets:
  - packages/py/*/*
  - apps/server
  - apps/cli
  - examples/extensions/*

# 요약 표의 묶음(이름 → 패키지 폴더 glob, 위에서부터 처음 맞는 것). 번역 작업 나눔과 같게 둔다.
groups:
  - name: contracts-base
    paths: [packages/py/base/*]
  - name: modules-a-l
    paths: ["packages/py/modules/ac-mod-[a-l]*"]
  - name: modules-m-z-links-kit
    paths: ["packages/py/modules/ac-mod-[m-z]*", packages/py/links/*, packages/py/kit/*]
  - name: features-examples
    paths: [packages/py/features/*, examples/extensions/*]
  - name: apps
    paths: [apps/*]

# 원문 언어와 원문 문자를 찾는 정규식(서버 원문은 한국어 — design I-7).
source_language: ko
source_pattern: "[\\u1100-\\u11ff\\u3130-\\u318f\\uac00-\\ud7a3]"

# 묶어 둔 언어(완전해야 함 — I-9). `codes`는 모든 언어, `text`는 원문 언어가 아닌 언어만 본다.
languages: [ko, en]

# 소스에서 문구·코드를 모을 범위(패키지 폴더 기준 glob). `locales/`는 늘 뺀다.
sources:
  python: ["src/**/*.py"]
  data: ["src/**/*.yaml", "src/**/*.yml", "src/**/*.json"]
  exclude: ["src/**/testing/**", "src/**/testing.py", "src/**/_testing.py", "src/**/fixtures/**"]

codes:
  # 오류·이슈 코드 모양. 이 모양인 문자열만 코드로 본다.
  pattern: "^[a-z][a-z0-9_]*(?:\\.[a-z0-9_]+)*$"
  # 이 이름(정규식)의 클래스 안 문자열 상수는 모두 코드 정의다(ErrorCodes·KnownIssueCodes 포함).
  class_pattern: "Codes$"
  # 코드가 아닌 것(정규식, 전체 일치). 검사 도구 자신이 내는 코드처럼 화면에 나오지 않는 것.
  exclude:
    - "i18n\\.(missing_key|extra_key|untranslated|placeholder_mismatch|missing_code|missing_text|unknown_placeholder)"

texts:
  # 서버 원문으로 보지 않을 문자열(정규식, search).
  exclude: []
  # 응답에서 들어가지 않을 키(값 전체를 건너뜀). `$comment`는 화면에 나오지 않는 스키마 주석.
  # `default`·`const`·`enum`·`examples`·`example`(x-ui 예시)은 스키마의 데이터 값이다 — 웹 schema-form
  # 번역(`translateSchema`)도 들어가지 않는다. 설정 값이라 화면에서 번역하면 저장 값이 바뀌고,
  # 에이전트에게 가는 본문 기본값(도구 설명·결과 문구·프롬프트 틀)도 여기 있다(design §I18N.4 "번역 안 함").
  # `yaml_snippet`은 모듈 옵션 조회의 복사용 설정 YAML(값 = 설치자 데이터)이다.
  skip_keys: ["$comment", default, const, enum, examples, example, yaml_snippet]
  # 위 키라도 이 부모 키 바로 안에서는 문자열 값을 모은다(부모 → 키). x-ui `example`은 입력 칸에
  # 보이는 예시 글자라 웹 schema-form이 화면 언어로 옮긴다(문자열일 때만 — 숫자·객체 예시는 데이터).
  keep_keys_in:
    x-ui: [example]
  # 값이 `이름 → 스키마` 표인 키. 그 안의 키는 속성 이름이라 위 skip_keys로 보지 않는다(`default`라는
  # 이름의 속성도 스키마다 — 웹 translateSchema와 같다).
  name_maps: [properties, patternProperties, $defs, definitions, dependentSchemas]
  # 같은 문구가 여러 패키지에 있을 때 뽑기가 고를 패키지(앞이 이김). 없으면 이름 순 첫째.
  prefer_owners: [ac-contracts]
  # 값이 섞인 칸의 원문 틀 + 값 표 키(계약 `text_templates`: 칸 JSON Pointer → [{template, params}]).
  # 이 표가 있는 객체는 틀(중첩 params 포함)을 원문으로 보고, 틀이 덮은 칸 값은 dynamic_text로 보지 않는다.
  templates_key: text_templates

# S1 정적 출처: 서버 응답 밖에서 웹이 서버 묶음으로 번역해 그리는 원문(서버 없이 읽는다).
static:
  # 계약 JSON Schema 문서(생성물, `poe contracts`)에서 웹 폼이 그리는 모델과 `$ref`로 닿는 정의.
  # 모델 이름은 `models`(이름을 변수로 넘기는 곳)와 웹 소스의 `getContractSchema("이름")`에서 찾는다.
  schemas:
    - document: packages/ts/lib/contracts/schema/agent-console.schema.json
      defs: $defs
      # 이름을 변수로 넘겨 웹 소스에서 찾을 수 없는 모델(지금은 없음 — 키 이름만 읽는 곳은 넣지 않는다).
      models: []
      discover:
        files: ["apps/web/src/**/*.ts", "apps/web/src/**/*.tsx", "packages/ts/lib/*/src/**/*.ts", "packages/ts/lib/*/src/**/*.tsx"]
        exclude: ["**/*.test.ts", "**/*.test.tsx", "**/*.test-d.ts", "**/testing/**"]
        pattern: "getContractSchema\\(\\s*[\"'](\\w+)[\"']"
  # 패키지 데이터 파일 중 화면에 그대로 가는 값(`select` 경로, `*` = 목록 항목). 서버 훑기가 데이터를
  # 만들어야만 보이는 값(예: 스펙의 작업 문법)을 여기서 바로 본다.
  data:
    - files: [packages/py/features/ac-sdd/src/agent_console_sdd/data/default_syntax.yaml]
      select: ["/*/statuses/*/label"]
    # 로그 분류기 기본 설정의 이벤트 제목·요약 틀과 내부 추론 표시(`default` 값이지만 화면에 가는
    # 이벤트 글자다 — 웹이 이벤트 제목·요약을 서버 묶음으로 옮긴다). 크롤 서버에는 세션 기록이 없어
    # 응답으로는 보이지 않는다. `pointer_slots`: `{/포인터}` 틀은 분류기가 `text_templates`로 싣는
    # 이름 자리 표시 꼴(`{이름}`)로 본다.
    - files: [packages/py/features/ac-logs-claude/src/agent_console_logs_claude/data/classifier_config.schema.json]
      select:
        - "/properties/row_rules/default/*/title"
        - "/properties/row_rules/default/*/summary/*"
        - "/properties/summaries/default/*/*"
        - "/properties/thinking_note/default"
      pointer_slots: true
  # 파이썬 소스에서 화면에 가는 글자: 로그 출처·분류기가 코드로 정한 이벤트 제목·틀(정한 호출의
  # 키워드 인자와 사전 키 값). f-string은 값 자리를 `{…}`로 둔 꼴로 모아 dynamic_text가 된다.
  python:
    - files:
        - "packages/py/features/ac-logs/src/**/*.py"
        - "packages/py/features/ac-logs-claude/src/**/*.py"
        - "packages/py/features/ac-hook-probe/src/**/*.py"
        - "packages/py/links/ac-link-logs-*/src/**/*.py"
      calls: [LogEventDraft, TextTemplate, update, replace, _diagnostic]
      keywords: [title, summary, template]
      dict_keys: [title]

# 오류·이슈 객체 모양: 이 두 키가 문자열이면 이슈로 보고 `message`는 S1이 아니라 S2(코드)로 본다.
issue:
  code: code
  message: message
  details: details

# 규칙별 심각도(error = 종료 코드 1, warning = 경고만). `--strict`는 모두 error로 본다.
# 번역(I.7)이 끝나기 전이라 빠진 문구·코드는 경고로 시작한다 — I.15에서 아래 다섯 줄을 error로 바꾼다.
severity:
  missing_text: warning
  untranslated_text: warning
  dynamic_text: warning
  unowned_text: warning
  missing_code: warning
  untranslated_code: warning
  unowned_code: warning
  stale_code: warning
  placeholder_mismatch: error
  unknown_placeholder: error
  catalog_unregistered: error
  catalog_invalid: error

# S1: 조립 서버(fake 백엔드, 빈 작업 공간)의 OpenAPI GET 경로를 훑는다.
server:
  openapi: /api/v1/openapi.json
  # 서버 프로세스 환경(값의 `{tmp}` = 임시 폴더). 실제 ~/.claude를 읽지 않게 빈 폴더를 준다.
  env:
    CLAUDE_CONFIG_DIR: "{tmp}/claude-config"
  # 모듈 설정(`modules.options`). 모델 계정 조회는 끈다(크롤이 실제 백엔드 계정을 묻지 않게 —
  # 아래 skip_paths와 이중 안전장치. 환경에 키·토큰이 있어도 CLI·Models API를 부르지 않는다).
  options:
    link-projects-runs: {require_project: false}
    mod-runs: {model_discovery: {enabled: false}}
  # 씨앗 전에 만들 폴더(`{tmp}` = 임시 폴더). 등록할 프로젝트 폴더다.
  dirs: ["{tmp}/i18n-project"]
  # 훑기 전에 만들 데이터(ASCII 이름만 — 사용자 데이터가 원문으로 잡히지 않게). 본문 문자열의 `{tmp}`는
  # 임시 폴더로 바꾸고, 본문이 문자열이면 text/plain으로 보낸다.
  seeds:
    - method: POST
      path: /api/v1/agents
      body: {id: i18n-agent, name: i18n-agent, backend: fake-agent, backend_options: {default: {response: ok}}}
    - method: POST
      path: /api/v1/graphs
      body:
        id: i18n-graph
        name: i18n-graph
        nodes:
          - {id: you, type: user, label: you}
          - {id: a, type: agent, label: a, config: {agent_ref: i18n-agent}}
        edges:
          - {id: m1, source: {node: you, port: says}, target: {node: a, port: in}, kind: message, config: {}}
          - {id: r1, source: {node: a, port: out}, target: {node: you, port: hears}, kind: reply, config: {}}
    - {method: POST, path: /api/v1/projects, body: {id: i18n-project, name: i18n-project, folder: "{tmp}/i18n-project"}}
    - {method: POST, path: /api/v1/resources, body: {id: i18n-resource, type: instruction, name: i18n-resource}}
    - method: PUT
      path: /api/v1/resources/i18n-resource/content
      body: "i18n"
      if_match: {from: /api/v1/resources/i18n-resource/versions, select: /0/version_hash}
    - {method: POST, path: /api/v1/sdd/templates, body: {id: i18n-template, name: i18n-template}}
    - {method: POST, path: /api/v1/sdd/specs, body: {id: i18n-spec, name: i18n-spec}}
    - {method: POST, path: /api/v1/wiki/rules, body: {id: i18n-rules, name: i18n-rules}}
    - {method: POST, path: /api/v1/wiki/wikis, body: {id: i18n-wiki, name: i18n-wiki, rules: [i18n-rules]}}
    - {method: PUT, path: /api/v1/wiki/wikis/i18n-wiki/pages/home, body: {content: "# home\n"}}
    - {method: POST, path: /api/v1/conversations, body: {graph_id: i18n-graph, title: i18n}}
  # 경로 변수 값: `values`(고정) 또는 `from`(GET 경로) + `select`(`/` 경로, `*` = 목록 항목).
  params:
    agent_id: {values: [i18n-agent]}
    graph_id: {values: [i18n-graph]}
    node_id: {values: [a]}
    module_id: {from: /api/v1/modules, select: "/*/id"}
    backend_id: {from: /api/v1/backends, select: "/*/id"}
    profile_id: {from: /api/v1/architecture/profiles, select: "/profiles/*/id"}
    project_id: {values: [i18n-project]}
    resource_id: {from: /api/v1/resources, select: "/*/id"}
    template_id: {from: /api/v1/sdd/templates, select: "/*/id"}
    spec_id: {values: [i18n-spec]}
    doc_id: {from: /api/v1/sdd/specs/i18n-spec, select: "/documents/*/id"}
    rule_id: {values: [i18n-rules]}
    wiki_id: {values: [i18n-wiki]}
    page: {values: [home]}
    conversation_id: {from: /api/v1/conversations, select: "/*/id"}
  # 질의 변수 값: 경로가 OpenAPI에 이 질의 변수를 선언했으면 값마다 `?이름=값`으로 한 번 더 읽는다
  # (프로젝트 공간에서만 나오는 문구 — 예: 프로젝트 `.claude` 가져오기 출처).
  query_params:
    project: {values: [i18n-project]}
  # 경로 변수 하나가 가질 값 수 상한(곱이 너무 커지지 않게).
  max_param_values: 50
  # 훑지 않을 경로(OpenAPI 경로 틀, fnmatch).
  skip_paths:
    - /api/v1/i18n/{lang}                  # 문구 묶음 자체(원문이 키로 들어 있다)
    - /api/v1/backends/{backend_id}/models # 백엔드가 외부에 물을 수 있다(실호출 금지)
    - /api/v1/backends/{backend_id}/model-catalog # 계정 모델 조회(CLI·Models API, 실호출 금지)
    - /api/v1/backends/login/*             # 로그인 세션
