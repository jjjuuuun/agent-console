# 공개 가능 린트: 공개 문서에 내부 참조가 남지 않게 한다. 패턴은 Python 정규식(줄 단위).
# 코드 블록 안도 검사한다(복사해 쓰는 예에 내부 경로가 섞이지 않게). `prose_only: true` 규칙만
# 코드 펜스·인라인 코드(백틱) 밖 글을 본다.
# 줄 하나만 예외로 두려면 그 줄에 `<!-- extdocs:allow <규칙 id> -->`를 단다(README "공개 가능 린트").
rules:
  - id: internal-doc-link
    message: 내부 설계 문서(specs/·docs/design/)를 가리킨다
    # (1) 링크 대상 안의 specs/·docs/design/ 경로 조각, (2) ./·../ 상대 경로로 이어지는 것,
    # (3) 맨 앞에서 시작하는 문서 경로(specs/<...>.md·docs/design/).
    # API 경로(/sdd/specs/{id})나 제품이 만드는 폴더(specs/demo)처럼 앞에 경로 조각이 붙거나
    # .md 파일이 아닌 specs/는 잡지 않는다.
    pattern: "\\]\\([^)\\s]*(?<![\\w-])(?:specs|docs/design)/|(?<=\\./)(?:specs|docs/design)/|(?<![\\w/.-])(?:specs/\\S*?\\.md\\b|docs/design/)"
  - id: internal-config
    message: 이 저장소의 개발 설정(CLAUDE.md·.claude/)을 가리킨다
    # 제품이 읽고 쓰는 Claude Code 파일(`~/.claude/projects`, 프로젝트 `.claude/agents`, 내보낸 `CLAUDE.md`)은
    # 파일 이름이 데이터다. 그래서 다음만 잡는다:
    # (1) 링크 대상으로 가리킴, (2) "저장소(의) (루트) CLAUDE.md"처럼 이 저장소 것이라고 말함,
    # (3) 따옴표·백틱으로 감싸지 않고 경로 조각도 없이 글 속에 맨이름으로 씀.
    # 홈·설정 폴더·하위 경로(~/.claude, ${CLAUDE_CONFIG_DIR}/, ./.claude/, */.claude/)와
    # `CLAUDE.md`·'.claude/agents/x.md'처럼 감싼 파일 이름은 제품 형식으로 본다.
    pattern: "\\]\\([^)\\s]*(?:CLAUDE\\.md|\\.claude/)|(?:저장소|repository|repo)\\S*\\s+(?:루트\\S*\\s+)?[`'\"]?(?:CLAUDE\\.md|\\.claude/)|(?<![\\w`'\"/.~*$}-])(?:CLAUDE\\.md|\\.claude/)"
  - id: design-section
    message: 설계 절 표기(§)
    pattern: "§"
  - id: task-number
    message: "작업 번호(예: 5.2R.3)"
    pattern: "(?<![A-Za-z0-9.])\\d+(?:\\.\\d+)?R\\.\\d+"
  - id: design-id
    message: "설계·요구사항 id(예: X22, R8.6, K33-19)"
    # X(확장 지점)·K(결정)·R(요구사항) 번호. 요구사항 id 모양의 예제 데이터(`R1`)가 코드에 나오므로
    # 코드 펜스·인라인 코드 밖 글만 본다.
    pattern: "(?<![A-Za-z0-9_.\\-/#])(?:X\\d{1,3}|R\\d{1,3}(?:\\.\\d+)*|K\\d{1,3}(?:-\\d+)?)(?![A-Za-z0-9_]|[.\\-][A-Za-z0-9_])"
    prose_only: true
  - id: local-path
    message: 로컬 경로
    pattern: "/home/|/mnt/[a-z]/|/Users/|\\b[A-Za-z]:\\\\"
  - id: email
    message: 이메일 주소
    pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
