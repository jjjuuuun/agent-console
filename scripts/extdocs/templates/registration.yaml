# 생성 구간 문장 틀(등록 종류별). 자리표시자는 {이름} — 없는 값은 빈 문자열.
# 쓸 수 있는 값: slug, title, kind, group, group_symbol, port, port_symbol, multi, path,
#   settings(쉼표로 이은 설정 키), disable, export, name, package(선언한 배포 이름)
# 모르는 kind는 `_default`를 쓴다(등록 종류 원문이 그대로 나온다).
# 값이 목록이면 자리표시자가 모두 채워지는 첫 문장을 쓴다(마지막 문장은 무조건 — 빈 값이어도 쓴다).
# 생성 문서는 영어 단일 문서다(문장은 영어, 문서에는 줄임형을 쓰지 않는다).
kinds:
  entry-point:
    register:
      - "Register in the entry point group `{group}` (constant `{group_symbol}`). The registration name is the id."
      - "Register in the entry point group `{group}`. The registration name is the id."
    disable: "Add the name to the setting `plugins.disabled`, or uninstall the package, then restart the server."
  port:
    register:
      - "A server module provides the port `{port}` (symbol `{port_symbol}`, multiple: {multi})."
      - "A server module provides the port `{port}` (multiple: {multi})."
    disable: "Turn off the providing module (`modules.<id>.enabled: false`); consumers turn off only the parts that use it."
  data:
    register:
      - "Uses the package data `{path}`; the settings {settings} override it."
      - "Uses the package data `{path}`."
      - "Register a data file (no code)."
    disable:
      - "Keys that turn it off: {disable}."
      - "Remove the settings {settings} to go back to the package data defaults."
      - "Remove the data to drop only that item."
  injection:
    register: "Inject an implementation through a constructor or an argument (an object that follows the interface)."
    disable: "Without an injected implementation, the default implementation is used."
  annotation:
    register: "Add the schema annotation key `{name}`."
    disable: "Remove the annotation to go back to the default behavior."
  descriptor:
    register: "Put a value in the descriptor field `{name}`."
    disable: "Leave the field empty to use the default."
  props:
    register: "Pass it in the props of the component `{export}` (registered at build time)."
    disable: "Remove it from the props and rebuild."
  registry:
    register: "Add an entry to the web app registry `{name}` (registered at build time)."
    disable: "Remove the entry and rebuild."
  capability:
    register: "Give the implementation object (for example, a backend) the optional method `{name}`. The host finds and uses it when it is there."
    disable: "Remove the method or return None to turn off only that capability."
  field:
    register: "Put a value in the contract field `{name}` (an open value, with no code registration)."
    disable: "Leave the value unset; only the features that use the field stay empty."
  _default:
    register: "Registration kind `{kind}`."
    disable: ""
