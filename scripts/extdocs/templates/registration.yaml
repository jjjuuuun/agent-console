# 생성 구간 문장 틀(등록 종류별). 자리표시자는 {이름} — 없는 값은 빈 문자열.
# 쓸 수 있는 값: slug, title, kind, group, group_symbol, port, port_symbol, multi, path,
#   settings(쉼표로 이은 설정 키), disable, export, name, package(선언한 배포 이름)
# 모르는 kind는 `_default`를 쓴다(등록 종류 원문이 그대로 나온다).
kinds:
  entry-point:
    register: "entry point 그룹 `{group}`(상수 `{group_symbol}`)에 등록한다. 등록 이름 = id."
    disable: "설정 `plugins.enabled`에서 빼거나 패키지를 제거하고 서버를 다시 시작한다."
  port:
    register: "서버 모듈이 포트 `{port}`(기호 `{port_symbol}`, 다중 {multi})를 제공한다."
    disable: "제공하는 모듈을 끄면(`modules.<id>.enabled: false`) 소비하는 쪽은 그 부분만 꺼진다."
  data:
    register: "패키지 데이터 `{path}`를 설정({settings})으로 덮어쓴다."
    disable: "끄는 키: {disable}."
  injection:
    register: "생성자·인자로 구현을 주입한다(인터페이스를 따르는 객체)."
    disable: "주입하지 않으면 기본 구현을 쓴다."
  annotation:
    register: "스키마 주석 키 `{name}`를 단다."
    disable: "주석을 지우면 기본 동작으로 돌아간다."
  descriptor:
    register: "서술자 필드 `{name}`에 값을 넣는다."
    disable: "필드를 비우면 기본값을 쓴다."
  props:
    register: "컴포넌트 `{export}`의 props로 넘긴다(빌드 시 등록)."
    disable: "props에서 빼고 다시 빌드한다."
  registry:
    register: "웹 앱 레지스트리 `{name}`에 항목 하나를 더한다(빌드 시 등록)."
    disable: "항목을 빼고 다시 빌드한다."
  capability:
    register: "구현 객체(예: 백엔드)에 선택 메서드 `{name}`를 갖춘다. 호스트가 있으면 찾아 쓴다."
    disable: "메서드를 없애거나 None을 돌려주면 그 능력만 꺼진다."
  field:
    register: "계약 필드 `{name}`에 값을 넣는다(열린 값, 코드 등록 없음)."
    disable: "값을 넣지 않으면 그 필드를 쓰는 기능만 비어 있다."
  _default:
    register: "등록 종류 `{kind}`."
    disable: ""
