[[contracts]]
name = "연동 모듈은 기능 모듈의 공개 포트(ports)만 본다 (modularity §3.7 규칙 4, 3R.16)"
type = "forbidden"
source_modules = ["@link"]
forbidden_modules = ["@module"]
# 예외 사유(3R.30): 연동 모듈이 기능 모듈에서 볼 수 있는 것은 공개 포트 선언(`<모듈>.ports`, PortKey·프로토콜)뿐이다.
# 포트는 이름 문자열로 맞추므로 import 없이도 연결되지만, 포트 타입(프로토콜)을 쓰려면 ports만 import해도 된다.
# 예외는 "연동 패키지(루트와 하위 모듈) → 기능 모듈의 ports" 조합으로만 건다. 3R.16까지는 "** -> @module.ports"
# 여서 기능 모듈이 자기 ports를 import하는 내부 import 36개까지 무시 목록에 잡혔다(연동 import는 0개). 이 계약과
# 무관한 그 내부 import를 빼려고 가져오는 쪽을 연동 패키지로 좁혔다(그래서 무시 수 = 연동이 ports를 import한 수).
ignore_imports = ["@link -> @module.ports", "@link.** -> @module.ports"]
allow_indirect_imports = true
# 지금은 포트 이름(문자열)으로만 연결해 ports를 import하는 연동이 없다(허용 목록이 비어도 통과).
unmatched_ignore_imports_alerting = "none"

