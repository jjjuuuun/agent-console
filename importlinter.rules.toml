# import-linter 규칙(그룹 사용 가능).
# scripts/pkgkit/importlinter_sync.py가 pyproject.toml로 펼친다.
# 그룹: @all @packages @app @<kind>, 빼기: !이름 / !@그룹.
# 자세한 문법은 importlinter_sync.py 머리말. `poe importlinter-sync`로 pyproject.toml에 반영, `poe pkg-lint`가 차이를 검사.
# 그룹을 쓴 계약은 새 패키지가 생기면 자동으로 넓어진다(예: "패키지는 앱을 모른다", "X는 다른 사내 패키지에 의존하지 않는다").
# "X는 A·B에만 의존" 계약은 금지 목록을 손으로 적지 않고 `["@all", "!A", "!B"]`(허용만 빼기)로 쓴다.
# 새 패키지는 자동으로 금지 쪽에 들어간다. 이 계약들은 직접 import만 본다(allow_indirect_imports = true).
# A·B도 각자 자기 계약을 가지므로 간접 경로는 계약끼리 이어서 막힌다. 허용 패키지의 의존이 늘어도 X 계약이 깨지지 않는다.
root_packages = ["@all"]

[options]
# 외부 패키지(fastapi·starlette) 금지 계약에 필요하다(modularity §3.7 규칙 1, 3R.16).
include_external_packages = true

