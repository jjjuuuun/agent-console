# Agent Console — Python uv workspace 루트 (가상 프로젝트, 배포하지 않음)
# 설치: uv sync --all-packages   검사: uv run poe check
[project]
name = "agent-console-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "poethepoet>=0.29",
    "types-jsonschema>=4.26.0.20261006",
    "types-regex>=2026.9.29.20261005",
]

[tool.uv]
package = false

[tool.uv.workspace]
# 종류 폴더 배치(design §3R.2.1): packages/py/{base,features,kit,modules,links}/<패키지>
members = ["packages/py/*/*", "apps/server", "apps/cli"]

# 저장소 안에서 사내 패키지를 로컬 워크스페이스로 잇는 선언은 **여기에만** 둔다(P1, design §3R.2.4).
# 멤버 pyproject에는 이름 + 버전 범위만 있다. 새 패키지는 `poe new-package`가 workspace 목록에 넣는다.
[tool.uv.sources]
agent-console-contracts = { workspace = true }
agent-console-registry = { workspace = true }
agent-console-settings = { workspace = true }
agent-console-secret-rules = { workspace = true }
agent-console-safe-regex = { workspace = true }
