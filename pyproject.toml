# ---------------------------------------------------------------- poe (CLAUDE.md "명령어")
# mypy 캐시는 저장소 루트 `.mypy_cache` 한곳에만 쌓는다(5.2R.94b). `poe examples`·`poe mypy-package`처럼
# 패키지·예제 폴더에서 도는 mypy도 이 값을 물려받는다. 환경에 이미 MYPY_CACHE_DIR가 있으면 그것을 쓴다.
# `poe portability`는 복사본 검사에 이 값을 넘기지 않는다(캐시는 임시 복사본 안).
[tool.poe.env]
MYPY_CACHE_DIR.default = "${POE_ROOT}/.mypy_cache"

[tool.poe.tasks]
lint = { sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
], help = "ruff check + format --check" }
typecheck = { sequence = [
    { cmd = "mypy" },
    { cmd = "python scripts/pkgkit/mypy_conftests.py" },
], help = "mypy (설정: [tool.mypy] files, conftest.py 제외) → conftest.py를 파일마다 mypy" }
imports = { cmd = "lint-imports", help = "import-linter 의존 방향 계약 (design.md §6.2)" }
test = { cmd = "pytest", help = "pytest 전체" }
check = { sequence = [
    "lint", "typecheck", "imports", "pkg-lint", "schema-help-lint", "test", "examples",
], help = "lint → typecheck → imports → pkg-lint → schema-help-lint → test → examples" }
schema-help-lint = { cmd = "python scripts/schema_help_lint.py --quiet", help = "설정 폼 도움말 린트: 계약·번들 플러그인 스키마의 설명·x-ui.tier·예시(번들 = 오류, 외부 = 경고)" }
# 확장 예제(워크스페이스 멤버가 아님, P8): 예제 폴더 자기 설정으로 mypy·pytest(설치하지 않고 src 경로).
examples = { sequence = [
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-architecture" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-architecture" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-collector" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-collector" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-condition" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-condition" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-delegation" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-delegation" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-edges" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-edges" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-interactions" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-interactions" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-log-source" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-log-source" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-memory-scope" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-memory-scope" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-nodes" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-nodes" },
    { cmd = "mypy", cwd = "examples/extensions/agent-console-example-usage" },
    { cmd = "pytest -q", cwd = "examples/extensions/agent-console-example-usage" },
], help = "확장 예제(examples/extensions/*)를 각 폴더 설정으로 mypy·pytest" }
fmt = { sequence = [
    { cmd = "ruff check --fix ." },
    { cmd = "ruff format ." },
], help = "자동 수정(ruff)" }
contracts = { sequence = [
    { cmd = "python -m agent_console_contracts export packages/ts/lib/contracts/schema" },
    { cmd = "pnpm --filter @agent-console/contracts run generate" },
], help = "계약(Pydantic) → JSON Schema → TS 타입 생성 (design §5.7)" }
contracts-check = { sequence = [
    { cmd = "python -m agent_console_contracts check packages/ts/lib/contracts/schema" },
    { cmd = "pnpm --filter @agent-console/contracts run generate:check" },
], help = "계약 재생성 결과가 커밋된 생성물과 같은지 검사(다르면 exit 1)" }

# ---------------------------------------------------------------- pkgkit (design §3R.2.5, scripts/pkgkit/README.md)
pkg-lint = { cmd = "python scripts/pkgkit/pkg_lint.py", help = "패키지 이식성 정적 검사(poe check에 포함)" }
importlinter-sync = { cmd = "python scripts/pkgkit/importlinter_sync.py", help = "importlinter.rules.toml → [tool.importlinter] 생성(--check: 차이만)" }
wheels = { cmd = "python scripts/pkgkit/wheels.py", help = "모든 패키지 휠 → dist/wheelhouse" }
portability = { cmd = "python scripts/pkgkit/portability.py", help = "패키지 폴더를 저장소 밖에 복사해 설치·ruff·mypy·pytest [--package NAME] [--wheels]" }
new-package = { cmd = "python scripts/pkgkit/new_package.py", help = "템플릿으로 새 패키지: --kind {base,feature,kit,module,link} NAME" }
mypy-package = { cmd = "mypy", cwd = "${path}", args = [
    { name = "path", positional = true, required = true, help = "패키지 폴더(저장소 루트 기준, 예: packages/py/modules/ac-mod-runs)" },
], help = "패키지 폴더 하나를 그 패키지 설정으로 mypy(캐시는 루트 .mypy_cache)" }
pkgkit-test = { cmd = "pytest -q -c scripts/pkgkit/pytest.ini scripts/pkgkit", help = "pkgkit 도구 자체 테스트" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", "packages/ts", "apps/web", "specs", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# ---------------------------------------------------------------- mypy
# 집계 실행용(패키지 설정이 기준, 내용은 scripts/pkgkit 템플릿과 같다 — `poe pkg-lint`가 검사).
# 확장 예제(examples/extensions/*)는 워크스페이스 멤버가 아니라 `poe examples`가 예제 폴더 설정으로 따로 검사한다.
[tool.mypy]
python_version = "3.12"
files = [
    "packages/py/*/*/src", "packages/py/*/*/tests",
    "apps/server/src", "apps/server/tests",
    "apps/cli/src", "apps/cli/tests",
    "tests/integration", "examples/resource-types/tests",
]
# 패키지 tests/에는 __init__.py가 없어 모든 conftest.py가 같은 모듈 이름 `conftest`가 된다.
# 집계 실행에서는 빼고 `scripts/pkgkit/mypy_conftests.py`(poe typecheck 둘째 단계)가 파일마다 검사한다.
exclude = ['(^|/)conftest\.py$']
strict = true
warn_unreachable = true

# ---------------------------------------------------------------- pytest
# 집계 실행용. 경로 우회(pythonpath)는 두지 않는다 — 테스트 도우미는 각 패키지의 공개 `testing` 모듈.
# 패키지 README doctest(design §3R.2.7)는 패키지 설정(`--doctest-glob=README.md`)으로 패키지 폴더에서도 돌고
# (poe portability), 집계 실행(poe test)도 같은 옵션으로 모든 README.md의 `>>>` 예를 함께 돌린다(3R.6).
[tool.pytest.ini_options]
testpaths = ["packages/py", "apps/server", "apps/cli", "tests/integration", "examples/resource-types"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

