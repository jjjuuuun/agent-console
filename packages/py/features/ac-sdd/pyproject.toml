[project]
name = "agent-console-sdd"
version = "0.1.0"
description = "Agent Console — SDD 핵심: 작업 문법·파싱·줄 고치기, 계획·추적·관문·규칙 검사, 틀·스펙 저장소, 가져오기/내보내기"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-safe-regex>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "agent-console-text-template>=0.1,<0.2",
    "markdown-it-py>=3.0",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.spec-template]
title = "Document template"
area = "sdd"
design_id = "X40"
summary = "Creates the document skeletons and rules that are copied into a new spec (definition kind `spec-template`) from the UI, files, or imports"
registration = { kind = "definition", name = "spec-template" }
interface = "agent_console_contracts.sdd:SpecTemplate"
builtin = "none"
example = { kind = "snippet", note = "Document template definition data" }
guide = "sdd.md"

[tool.agent-console.extension-points.sdd-syntax]
title = "Task syntax, requirement IDs, and phase rules"
area = "sdd"
design_id = "X41"
summary = "Changes, as data, the rules that read tasks, requirements, and phases from documents (package defaults, then user settings, then spec rules)"
registration = { kind = "data", path = "data/default_syntax.yaml", settings = ["sdd.syntax"], disable = ["sdd.include_default_syntax"] }
interface = ["agent_console_contracts.sdd:SpecSyntax", "agent_console_sdd:load_default_syntax"]
builtin = "none"
example = { kind = "snippet", note = "Data in the user setting `sdd.syntax`" }
guide = "sdd.md"
