[project]
name = "agent-console-sdd"
version = "0.1.0"
description = "Agent Console — SDD 핵심: 작업 문법·파싱·줄 고치기, 계획·추적·관문·규칙 검사, 틀·스펙 저장소, 가져오기/내보내기"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-safe-regex>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "agent-console-text-template>=0.1,<0.2",
    "markdown-it-py>=3.0",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.spec-template]
title = "문서 틀"
area = "sdd"
design_id = "X40"
summary = "스펙을 만들 때 복사할 문서 뼈대와 규칙(정의 종류 spec-template)을 화면·파일·가져오기로 만든다"
registration = { kind = "definition", name = "spec-template" }
interface = "agent_console_contracts.sdd:SpecTemplate"
builtin = "none"
example = { kind = "snippet", note = "문서 틀 정의 데이터" }
guide = "sdd.md"

[tool.agent-console.extension-points.sdd-syntax]
title = "작업 문법·요구 ID·단계 규칙"
area = "sdd"
design_id = "X41"
summary = "문서에서 작업·요구·단계를 읽는 규칙을 데이터로 바꾼다(패키지 기본 → 사용자 설정 → 스펙 규칙)"
registration = { kind = "data", path = "data/default_syntax.yaml", settings = ["sdd.syntax"], disable = ["sdd.include_default_syntax"] }
interface = ["agent_console_contracts.sdd:SpecSyntax", "agent_console_sdd:load_default_syntax"]
builtin = "none"
example = { kind = "snippet", note = "사용자 설정 sdd.syntax 데이터" }
guide = "sdd.md"
