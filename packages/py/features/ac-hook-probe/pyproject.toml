[project]
name = "agent-console-hook-probe"
version = "0.1.0"
description = "Agent Console — hook 명령 감싸기 실행 파일(입출력·결정·소요 시간 jsonl 기록, 기록 형식 hook-probe/1)과 그 기록을 읽는 로그 출처·분류기(X5 hook-probe-jsonl, X6 hook-probe)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.9,<0.10",
    "agent-console-logs>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
]

# 실행 파일. 원래 hook 명령 앞에 붙인다(`-- <명령>`).
[project.scripts]
agent-console-hook-probe = "agent_console_hook_probe._cli:main"

# 기록을 읽는 출처·분류기(X5·X6). 이름 = 레지스트리 key = id.
[project.entry-points."agent_console.log_sources"]
hook-probe-jsonl = "agent_console_hook_probe.plugins:HookProbeSource"

[project.entry-points."agent_console.log_classifiers"]
hook-probe = "agent_console_hook_probe.plugins:HookProbeClassifier"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
