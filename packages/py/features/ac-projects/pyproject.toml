[project]
name = "agent-console-projects"
version = "0.3.0"
description = "Pure project rules: folder registration conflicts and status, merging the registry with manifests, copy plans between spaces, path guards (x-path), reading old data, project layer values"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-numbered-id>=0.1,<0.2",
    "agent-console-local-folders>=0.1,<0.2",
]

[project.entry-points."agent_console.message_catalogs"]
ac-projects = "agent_console_projects"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.path-field]
title = "Path field marker"
area = "projects"
design_id = "X33"
summary = "Marks a settings schema property as a local path so that path guarding (rejecting paths outside the project folder) applies to it"
registration = { kind = "annotation", name = "x-path" }
interface = "agent_console_contracts:x_path"
builtin = "none"
example = { kind = "snippet", note = "Add the `x-path` annotation to a schema property" }
guide = "projects.md"
