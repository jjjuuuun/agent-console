[project]
name = "agent-console-projects"
version = "0.2.0"
description = "프로젝트 순수 규칙: 폴더 등록 충돌·상태, 등록부+매니페스트 합치기, 공간 사이 복사 계획, 경로 지킴(x-path), 옛 데이터 해석, 프로젝트 층 값"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-local-folders>=0.1,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.path-field]
title = "경로 필드 표시"
area = "projects"
design_id = "X33"
summary = "설정 스키마의 속성이 로컬 경로임을 표시해 경로 지킴(프로젝트 폴더 밖 거부) 대상으로 만든다"
registration = { kind = "annotation", name = "x-path" }
interface = "agent_console_contracts:x_path"
builtin = "none"
example = { kind = "snippet", note = "스키마 속성에 x-path 주석 달기" }
guide = "projects.md"
