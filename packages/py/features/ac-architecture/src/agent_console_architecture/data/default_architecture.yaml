# ac-architecture 패키지 기본 구조도 프로필(design §5.5R.2.3·§5.5R.2.5, 좌표는 docs/design/screen-architecture.md §9).
# 기능이 동작하는 데 필요한 기본값이다. 사용자가 워크스페이스 설정 `architecture`로 고치거나 끈다:
#   - 전부 끄기: `include_defaults: false`
#   - 이 프로필만 끄기: `profiles: {agent-architecture: null}`
#   - 바꾸기: 같은 id로 프로필 전체를 다시 적는다(id 단위로 통째로 바뀐다)
# 끄거나 비워도 다른 기능은 동작하고 구조도 화면은 "구조도 규칙 없음"을 보인다(R0.1 (3)·R8.8).
#
# 조건이 보는 값은 목록 질의가 주는 이벤트 본문(계약 `LogEvent`)이다. `detail`·`raw`는 목록·판정에 실리지
# 않으므로 쓰지 않는다. 범주·태그·도구 이름 틀은 기본 분류 데이터(`ac-logs-claude` 분류기 설정,
# `ac-link-logs-runs` run_event_map.yaml)에 맞춘 값이다. 분류 데이터를 바꾸면 여기 조건도 함께 바꾼다.
#
# 조건 문법: `when: {all: [...], any: [...]}`(둘 다 있으면 둘 다 만족), 항목 `{path: JSON 포인터, op, value}`.
# 연산자는 X22 등록 연산자(eq·ne·in·contains·matches·exists 등)다.
version: 1
profiles:
  agent-architecture:
    title: 에이전트 아키텍처
    description: 로그 이벤트를 에이전트 구성 요소(칸)와 전달(연결)로 묶어 센다
    canvas: {width: 1520, height: 812}
    zones:
      - {id: local, label: "LOCAL · 사용자 PC", description: "하네스 · SDK / CLI · 에이전트 런타임 · 작업 파일",
         x: 10, y: 16, w: 1260, h: 780, style: boundary}
      - {id: remote, label: "REMOTE · 모델 서버", description: "네트워크로 모델 요청 / 응답",
         x: 1290, y: 16, w: 220, h: 780, style: service}
      - {id: runtime, label: "모델 입력 준비 · 출력 처리 · 도구 순환",
         x: 370, y: 212, w: 880, h: 572, style: runtime}
    # 범주 오류(분류 체계 tone: danger)는 호출자가 따로 넘긴다. hook 차단(block·blocked)은 판정이지 오류가 아니다.
    error_when: {any: [{path: /status, op: in, value: [failed, error, declined]}]}
    # 같은 실행을 플랫폼 기록과 에이전트 세션 로그로 함께 읽으면 같은 호출이 두 번 들어온다.
    # 칸·연결마다 맞은 이벤트의 출처 종류 중 이 목록 앞의 것만 센다.
    source_priority: [claude-code-jsonl, platform-runs]
    group_limit: 8
    unassigned: true
    options: {inferred_llm_duration: false}
    cells:
      input:
        label: Task input
        description: 최초 과제 · 실행 지시
        x: 130
        y: 130
        zone: local
        tone: blue
        metrics: [count]
        when: {all: [{path: /category, op: eq, value: input}]}
      sdk:
        label: SDK / CLI
        description: 실행 진입점
        x: 470
        y: 130
        zone: local
        tone: blue
        metrics: [count, errors]
        # 실행 진입점이 남긴 기록: 세션·실행 시작과 상태(범주 system)
        when: {all: [{path: /category, op: eq, value: system}]}
      api:
        label: 에이전트 제어
        description: 세션 · 실행 제어
        x: 810
        y: 130
        zone: local
        tone: teal
        metrics: [count, errors]
        when: {all: [{path: /category, op: eq, value: control}]}
      rules:
        label: Rules
        description: CLAUDE.md · rules
        x: 130
        y: 280
        zone: local
        tone: gold
        metrics: [count]
        group_by: /documents/0/path
        when: {all: [{path: /documents/0/kind, op: eq, value: rules}]}
      instructions:
        label: Instructions · Skills
        description: SPEC · AGENTS.md · Skill
        x: 470
        y: 280
        zone: runtime
        tone: gold
        metrics: [count]
        group_by: /documents/0/kind
        when:
          any:
            - {path: /category, op: in, value: [document, skill, spec, agents_md]}
            - {path: /documents/0/kind, op: in, value: [spec, skill, agents_md, instructions]}
      context:
        label: Context builder
        description: 모델 입력 준비
        x: 810
        y: 280
        zone: runtime
        tone: teal
        metrics: [count]
        when: {all: [{path: /category, op: eq, value: context}]}
      llm:
        label: LLM
        description: 원격 모델 API
        x: 1400
        y: 280
        zone: remote
        tone: purple
        metrics: [count, errors, tokens, duration, inferred_duration]
        group_by: /model
        # 모델 응답(llm)과 모델 호출 사용량(usage). 소요를 아는 사용량은 시작(추정)·끝 두 이벤트라 추정 시작은 뺀다
        # (뺀 추정 시작 기록은 "분류 안 됨"에 남는다 — 같은 호출을 두 번 세지 않고 소요 표본도 한 번만 쓴다).
        when:
          all: [{path: /evidence, op: ne, value: inferred}]
          any:
            - {path: /category, op: eq, value: llm}
            - {path: /category, op: eq, value: usage}
        unavailable:
          - {item: LLM 요청 본문, reason: 구조도는 본문을 싣지 않음(표지만)}
          - {item: 시스템 프롬프트 본문, reason: 구조도는 본문을 싣지 않음(표지만)}
      dispatch:
        label: Dispatcher
        description: 모델 출력 처리 · 도구 선택
        x: 1150
        y: 580
        zone: runtime
        tone: teal
        metrics: [count]
        when: {all: [{path: /tags, op: contains, value: tool_call}]}
      hook:
        label: Hook
        description: 도구 전후 검사
        x: 810
        y: 580
        zone: runtime
        tone: pink
        metrics: [count, errors, duration]
        group_by: /correlation/hook_event
        # 소요를 아는 hook 끝 기록의 추정 시작은 뺀다(LLM 칸과 같은 이유)
        when:
          all:
            - {path: /category, op: eq, value: hook}
            - {path: /evidence, op: ne, value: inferred}
      tools:
        label: Tool handler
        description: 내장 도구
        x: 470
        y: 580
        zone: runtime
        tone: orange
        # 도구 호출(시작)만 센다 — 결과 행에는 도구 이름이 없어 도구별 묶음이 흐려진다. 결과·오류는 Tool result 칸.
        metrics: [count, duration]
        group_by: /tool
        when:
          all:
            - {path: /tags, op: contains, value: tool_call}
            - {path: /tool, op: matches, value: "^(?!mcp__)"}
            - {path: /category, op: ne, value: handoff}
      mcp:
        label: MCP 서버
        description: 외부 도구 연동 (위치는 설정에 따름)
        x: 1150
        y: 430
        zone: runtime
        tone: orange
        view: grouped
        metrics: [count, errors, duration]
        # 서버 이름이 없는 MCP 기록(Claude Code 진행 행 등)은 "(이름 없음)" 묶음이다
        group_by: /correlation/mcp_server
        when: {all: [{path: /category, op: eq, value: mcp}]}
      result:
        label: Tool result
        description: 호출 ID에 대응하는 결과
        x: 810
        y: 430
        zone: runtime
        tone: teal
        metrics: [count, errors]
        when: {all: [{path: /tags, op: contains, value: tool_result}]}
      workspace:
        label: Workspace
        description: 로컬 파일 · 명령 실행
        x: 470
        y: 430
        zone: runtime
        tone: blue
        metrics: [count]
        when:
          any:
            - {path: /category, op: eq, value: workspace}
            - {path: /documents/0/action, op: in, value: [created, modified, deleted]}
      delegation:
        label: Delegation · Merge
        description: 위임 · 결과 통합
        x: 130
        y: 580
        zone: local
        tone: gold
        metrics: [count, errors]
        when:
          any:
            - {path: /category, op: in, value: [handoff, merge]}
            - {path: /via, op: eq, value: delegate}
            - {path: /correlation/child_run, op: exists}
      subagents:
        label: 서브에이전트
        description: 위임받아 실행 (누르면 하위 구조도)
        x: 130
        y: 430
        zone: local
        tone: gold
        view: grouped
        metrics: [count, errors, tokens]
        group_by: /thread
        drill: {filter: thread, value: "{group}"}
        # Claude Code 서브에이전트 줄(분류기 subagent_thread_template "agent-{value}"),
        # 플랫폼은 위임자 아래 노드 경로(node_path가 둘 이상)
        when:
          any:
            - {path: /thread, op: matches, value: "^agent-"}
            - {path: /node_path/1, op: exists}
      response:
        label: Agent response
        description: 중간 메시지 · 최종 응답
        x: 1150
        y: 730
        zone: runtime
        tone: blue
        metrics: [count]
        when:
          any:
            - {path: /category, op: eq, value: agent}
            - {path: /role, op: eq, value: assistant}
    edges:
      - id: task_submit
        from: input
        to: sdk
        label: 과제 전달
        kind: observed
        style: request
        points: [[226, 130], [374, 130]]
        label_at: [300, 130]
        metrics: [count]
        # 위임받은 작업 수신(보낸 쪽이 있는 입력)은 위임 연결이 센다
        when:
          all:
            - {path: /category, op: eq, value: input}
            - {path: /from, op: eq, value: []}
      - id: control_request
        from: sdk
        to: api
        label: 제어 요청
        kind: observed
        style: request
        points: [[566, 112], [714, 112]]
        label_at: [640, 112]
        metrics: [count, errors]
        when: {all: [{path: /category, op: eq, value: control}]}
      # 제어 응답을 따로 기록한 이벤트가 없다(요청과 같은 행). 순서로만 아는 구조 연결이다.
      - {id: control_response, from: api, to: sdk, label: ID / 응답, kind: structural, style: inferred,
         points: [[714, 148], [566, 148]], label_at: [640, 148]}
      - {id: context_prepare, from: api, to: context, label: 문맥 준비, kind: structural, style: inferred,
         points: [[810, 170], [810, 240]], label_at: [810, 191]}
      - {id: instructions_apply, from: instructions, to: context, label: 지침 반영, kind: structural, style: inferred,
         points: [[566, 280], [714, 280]], label_at: [640, 280]}
      - {id: model_request, from: context, to: llm, label: 모델 요청, kind: structural, style: inferred,
         points: [[906, 280], [1304, 280]], label_at: [1105, 280]}
      - id: model_output
        from: llm
        to: dispatch
        label: 모델 출력
        kind: observed
        style: return
        points: [[1400, 320], [1400, 580], [1246, 580]]
        label_at: [1400, 450]
        metrics: [count, errors]
        when: {all: [{path: /category, op: eq, value: llm}]}
      - id: tool_call
        from: dispatch
        to: tools
        label: 도구 호출
        kind: observed
        style: request
        points: [[1110, 620], [1110, 655], [440, 655], [440, 620]]
        label_at: [775, 655]
        metrics: [count, errors, duration]
        # MCP 호출(mcp_call)과 서브에이전트 위임(delegate)은 뺀다
        when:
          all:
            - {path: /tags, op: contains, value: tool_call}
            - {path: /tool, op: matches, value: "^(?!mcp__)"}
            - {path: /category, op: ne, value: handoff}
      - {id: delegation_tools, from: delegation, to: tools, label: 위임/통합, kind: structural, style: inferred,
         points: [[226, 580], [374, 580]], label_at: [300, 580]}
      - {id: local_work, from: tools, to: workspace, label: 로컬 작업, kind: structural, style: inferred,
         points: [[440, 540], [440, 470]], label_at: [440, 505]}
      - id: work_result
        from: workspace
        to: result
        label: 작업 결과
        kind: observed
        style: return
        points: [[566, 430], [714, 430]]
        label_at: [640, 430]
        metrics: [count]
        when:
          any:
            - {path: /category, op: eq, value: workspace}
            - {path: /documents/0/action, op: in, value: [created, modified, deleted]}
      - id: tool_result
        from: tools
        to: result
        label: 도구 결과
        kind: observed
        style: return
        points: [[510, 540], [510, 505], [780, 505], [780, 470]]
        label_at: [645, 505]
        metrics: [count, errors]
        when:
          all:
            - {path: /tags, op: contains, value: tool_result}
            - {path: /category, op: ne, value: merge}
      - {id: next_context, from: result, to: context, label: 다음 요청에 반영, kind: structural, style: inferred,
         points: [[810, 390], [810, 320]], label_at: [810, 355]}
      - id: final_response
        from: dispatch
        to: response
        label: 메시지 전달
        kind: observed
        style: return
        points: [[1190, 620], [1190, 690]]
        label_at: [1190, 655]
        metrics: [count]
        when: {all: [{path: /role, op: eq, value: assistant}]}
      - {id: rule_load, from: rules, to: instructions, label: 규칙 로드, kind: structural, style: inferred,
         points: [[226, 280], [374, 280]], label_at: [300, 280]}
      - id: hook_run
        from: dispatch
        to: hook
        label: hook 실행
        kind: observed
        style: request
        points: [[1054, 580], [906, 580]]
        label_at: [980, 580]
        metrics: [count, errors, duration]
        # hook 한 번 = 끝 기록 하나(시작 기록은 출처마다 있거나 없다)
        when:
          all:
            - {path: /category, op: eq, value: hook}
            - {path: /stage, op: eq, value: complete}
      - id: hook_verdict
        from: hook
        to: tools
        label: 허용·차단
        kind: observed
        style: request
        points: [[714, 580], [566, 580]]
        label_at: [640, 580]
        metrics: [count, errors]
        # 도구 호출 id가 있는 hook. Claude Code는 세션 hook도 id 칸을 채우므로 도구 hook 이벤트 이름으로 거른다.
        # 플랫폼 기록(run_id가 있음)은 hook 시작이 도구 호출 id를 싣는다.
        when:
          all:
            - {path: /category, op: eq, value: hook}
            - {path: /correlation/tool_use_id, op: exists}
          any:
            - {path: /correlation/hook_event, op: in, value: [PreToolUse, PostToolUse, PostToolUseFailure, PermissionRequest]}
            - {path: /run_id, op: ne, value: ""}
      - id: mcp_call
        from: dispatch
        to: mcp
        label: MCP 호출
        kind: observed
        style: request
        points: [[1150, 540], [1150, 470]]
        label_at: [1150, 505]
        metrics: [count, errors, duration]
        when:
          all:
            - {path: /category, op: eq, value: mcp}
            - {path: /stage, op: eq, value: start}
      - id: mcp_result
        from: mcp
        to: result
        label: MCP 결과
        kind: observed
        style: return
        points: [[1054, 430], [906, 430]]
        label_at: [980, 430]
        metrics: [count, errors]
        when:
          all:
            - {path: /category, op: eq, value: mcp}
            - {path: /stage, op: eq, value: complete}
      - id: delegate
        from: delegation
        to: subagents
        label: 위임
        kind: observed
        style: request
        points: [[80, 540], [80, 470]]
        label_at: [80, 505]
        label_max_w: 92
        metrics: [count, errors]
        when:
          all: [{path: /stage, op: ne, value: complete}]
          any:
            - {path: /category, op: eq, value: handoff}
            - {path: /via, op: eq, value: delegate}
            - {path: /correlation/child_run, op: exists}
      - id: merge
        from: subagents
        to: delegation
        label: 결과 통합
        kind: observed
        style: return
        points: [[180, 470], [180, 540]]
        label_at: [180, 505]
        label_max_w: 92
        metrics: [count, errors]
        # 위임 결과(merge), 서브에이전트 끝(위임 호출 id가 있는 끝 기록), 자식 실행 끝
        when:
          all:
            - {path: /stage, op: eq, value: complete}
            - {path: /category, op: ne, value: hook}
          any:
            - {path: /category, op: eq, value: merge}
            - {path: /correlation/tool_use_id, op: exists}
            - {path: /correlation/child_run, op: exists}
    # 로그 출처 종류(X5 등록 이름) → 채울 수 있는 칸. 이 범위의 출처 중 칸을 채우는 것이 없으면 "수집 안 됨".
    coverage:
      claude-code-jsonl:
        cells: [input, sdk, api, rules, instructions, context, llm, dispatch, hook, tools, mcp, result,
                workspace, delegation, subagents]
        partial:
          rules: 도구로 연 문서만 보임(자동 로드는 기록 없음)
          hook: hook 소요는 세션 로그에 없음
          mcp: MCP 결과·오류는 Tool result 칸에 함께 보임
      # Rules: 맥락 구성(agent.context_prepared)의 규칙 리소스를 대응표가 첫 문서(kind rules)로 옮긴다(5.7R.7).
      platform-runs:
        cells: [sdk, api, rules, context, llm, dispatch, hook, tools, mcp, result, delegation, subagents,
                response]
