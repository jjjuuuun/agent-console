[project]
name = "agent-console-architecture"
version = "0.1.0"
description = "Agent Console — observed architecture maps: profile merging and checks, log events → map projection (pure functions), arch selection, profile plugins (X23)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "ruamel-yaml>=0.18",
    "pydantic>=2.9",
]

[project.entry-points."agent_console.message_catalogs"]
ac-architecture = "agent_console_architecture"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.architecture-profile]
title = "Architecture profile"
area = "architecture"
design_id = "X23"
summary = "Adds a set of cells, edges, and collection coverage for the architecture map (a profile) through user settings or a plugin"
registration = { kind = "entry-point", group = "agent_console_architecture:ARCHITECTURE_PROFILES_GROUP" }
interface = ["agent_console_architecture:ProfileSource", "agent_console_contracts.architecture:ArchitectureProfile"]
settings = ["architecture.profiles", "architecture.include_defaults"]
example = [
    { kind = "package", path = "examples/extensions/agent-console-example-architecture" },
    { kind = "snippet", note = "Data in the user setting `architecture.profiles`" },
]
guide = "architecture.md"
