[project]
name = "agent-console-local-folders"
version = "0.1.0"
description = "로컬 폴더 고르기 순수 규칙: 경로 정규화·폴더 확인·하위 폴더 나열·만들기(파일 시스템 주입)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.folder-browse-defaults]
title = "폴더 탐색 시작 위치·숨김 이름"
area = "projects"
design_id = "X34"
summary = "폴더 탐색 창의 시작 위치와 숨기는 이름을 데이터로 바꾼다"
registration = { kind = "data", path = "data/browse_defaults.json", settings = ["mod-projects.browse_roots"] }
interface = "agent_console_local_folders:load_browse_defaults"
builtin = "none"
example = { kind = "snippet", note = "설치자 설정 mod-projects.browse_roots" }
guide = "projects.md"
