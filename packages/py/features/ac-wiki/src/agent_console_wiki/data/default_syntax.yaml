# ac-wiki 패키지 기본 위키 문법(design §7R.1.3, X47). 기능이 동작하는 데 필요한 기본값이다.
# 사용자 설정 wiki.include_default_syntax: false로 통째로 끄고, wiki.syntax·위키 규칙 syntax로 키마다 덮는다.
# 이 파일의 값은 코드가 모른다(코드 개념은 머리말 역할 3개·기본 점검 3개·링크 대상 찾기 4개뿐).
links:
  - id: wikilink
    kind: pattern
    pattern: '\[\[(?P<target>[^\]\|#\n]+)(?:#(?P<anchor>[^\]\|\n]+))?(?:\|(?P<label>[^\]\n]+))?\]\]'
    resolve: [path, title, alias]
    insert: '[[{target}|{label}]]'
  - id: relative
    kind: markdown
    resolve: [relative_path]
    insert: '[{label}]({relative_path})'
front_matter:
  delimiter: '---'
  roles: {title: title, tags: tags, aliases: aliases}
title_sources: [front_matter, first_heading, file_name]
page_extensions: ['.md']
case_insensitive: true
schemes: []
lint:
  builtin: {broken_link: warning, orphan: info, duplicate_title: warning}
  write_rules: true
  orphan_ignore: []
