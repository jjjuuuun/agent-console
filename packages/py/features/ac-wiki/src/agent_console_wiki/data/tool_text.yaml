# ac-wiki 도구 묶음(WikiToolkit)의 문구 기본 데이터.
# 도구 이름·설명·결과 머리 줄·경로 안내는 리소스 config(계약 기본값 wiki_access_defaults.json)가 정한다.
# 여기는 입력 매개변수 설명, 결과 줄, 실패 문구다. WikiToolkit(text=...)로 바꿀 수 있다.
# 매개변수 이름(query·wiki·prefix·tags·limit·path·section·content·mode·template·title·if_hash·message·
# to·rewrite_links)은 계약 어휘라 바꾸지 않는다. 문구 안 {이름}은 ac-text-template 치환이다.
version: 1
inputs:
  query: 찾을 말. 공백으로 나눈 낱말을 모두 담은 페이지를 찾습니다.
  wiki: "위키 id. 생략하면 기본 위키입니다. 고를 수 있는 값: {choices}"
  prefix: 이 경로로 시작하는 페이지만(폴더 거르기).
  tags: 모두 붙어 있어야 하는 태그.
  limit: 돌려줄 최대 개수.
  path: 페이지 경로. 위키 폴더 기준이고 확장자는 붙이지 않습니다(예 guides/setup).
  section: 제목 글자. 주면 그 제목의 절만 읽거나(read) 바꿉니다(write mode=section).
  content: 페이지 본문(마크다운). mode=section이면 제목 줄 아래 절 본문입니다.
  mode: replace는 통째로 바꾸고, append는 끝에 붙이고, section은 section 제목의 절 본문만 바꿉니다.
  template: 새 페이지를 만들 때 쓸 페이지 틀 id. content를 함께 주면 틀 본문 끝에 붙입니다.
  title: 페이지 틀에 넣을 제목.
  if_hash: 이 해시(content_hash)일 때만 고칩니다. 다르면 충돌로 알려 줍니다.
  message: 기록에 남길 한 줄 설명.
  to: 새 페이지 경로.
  rewrite_links: 참이면 다른 페이지의 링크도 새 경로로 고칩니다.
# 읽기 결과: 머리 줄(result_header) 다음 줄. 비우면 줄을 넣지 않는다. {hash} {path} {wiki}
read_meta: "content_hash: {hash}"
# 절만 읽었을 때 머리 줄 다음 줄. {section}
read_section: "(절: {section})"
# 검색 결과 한 줄. {wiki} {path} {title} {snippet} {score}
search_item: "- {wiki}:{path} · {title}\n  {snippet}"
search_empty: 찾은 페이지가 없습니다.
search_degraded: "(느린 대체 검색으로 찾았습니다)"
# 목록 한 줄. {wiki} {path} {title} {tags} {backlinks} {broken_links}
list_item: "- {path} · {title}"
list_empty: 페이지가 없습니다.
list_truncated: "…(목록이 잘렸습니다: {shown}/{total})"
# 링크 결과. 제목 줄 다음에 항목 줄들, 항목이 없으면 links_none.
links_out_title: "나가는 링크:"
links_in_title: "들어오는 링크(백링크):"
links_broken_title: "끊긴 링크:"
links_none: "  (없음)"
# {raw} {target} {label} {resolved} {status}
links_out_item: "  - {raw} → {resolved}"
links_other_item: "  - {raw} [{status}]"
# {path} {title} {count}
links_in_item: "  - {path} · {title} ({count}개)"
# {raw} {target} {suggested_path}
links_broken_item: "  - {raw} (만들 경로 제안: {suggested_path})"
# 쓰기 결과. {wiki} {path} {hash} {version}
written: "{wiki}:{path}를 고쳤습니다. content_hash: {hash}"
created: "{wiki}:{path}를 새로 만들었습니다. content_hash: {hash}"
unchanged: "{wiki}:{path}는 본문이 같아 바꾸지 않았습니다. content_hash: {hash}"
# 쓰기·옮기기 경고 한 줄. {code} {rule_id} {message} {lines}
warning_item: "- 경고 [{code}] {message}"
# 옮기기 결과. {wiki} {path} {to} {rewritten} {conflicts}
moved: "{wiki}:{path}를 {to}로 옮겼습니다. 링크를 고친 페이지 {rewritten}개."
move_conflicts: "그사이 바뀌어 링크를 고치지 못한 페이지: {conflicts}"
deleted: "{wiki}:{path}를 지웠습니다. 사람은 기록에서 되돌릴 수 있습니다."
truncated: "…(잘림: {limit}자)"
# 결과 머리 줄·표시에서 값이 없을 때 넣는 글자.
unknown: "-"
# 실패 문구(이유 → 문장). 결과 앞에 [사유 코드]가 붙는다.
# {wiki} {path} {section} {rule_id} {message} {lines} {limit} {hash} {template}
errors:
  wiki.denied: "{wiki} 위키에서 이 일을 할 권한이 없습니다."
  wiki.wiki_unavailable: "{wiki} 위키는 이 실행에서 쓸 수 없습니다."
  wiki.page_not_found: "{wiki}:{path} 페이지가 없습니다."
  section_not_found: "{wiki}:{path}에 '{section}' 제목이 없습니다."
  wiki.template_missing: "페이지 틀 '{template}'이 없습니다."
  wiki.conflict: "다른 쪽이 먼저 고쳤습니다. 지금 content_hash는 {hash}입니다. 다시 읽고 쓰세요."
  wiki.page_exists: "{wiki}:{path} 페이지가 이미 있습니다."
  wiki.too_large: "한도를 넘었습니다({limit})."
  wiki.secret_rejected: "비밀로 보이는 값이 있어 쓰지 않았습니다(줄 {lines}). 값을 빼고 다시 쓰세요."
  wiki.rule_rejected: "위키 규칙 '{rule_id}'가 거부했습니다: {message} (줄 {lines})"
  wiki.rate_limited: "이 실행에서 쓸 수 있는 횟수를 넘었습니다."
  wiki.invalid_path: "'{path}'는 페이지 경로로 쓸 수 없습니다."
  invalid_input: "입력 형식이 틀렸습니다."
  error: "요청을 처리하지 못했습니다."
