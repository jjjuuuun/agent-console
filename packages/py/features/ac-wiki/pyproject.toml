[project]
name = "agent-console-wiki"
version = "0.1.0"
description = "Agent Console — 위키 핵심: 문법·페이지 파싱·링크 해석·색인·페이지 파일"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-safe-regex>=0.1,<0.2",
    "agent-console-safe-zip>=0.1,<0.2",
    "agent-console-text-template>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "markdown-it-py>=3.0",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
# 하위 모듈 `sqlite`의 기록 저장소(SQLAlchemy Core)와 계보 시험(Alembic). ac-store가 이미 끌어온다.
sqlite = ["sqlalchemy>=2.0", "alembic>=1.13"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.wiki-rules]
title = "위키 규칙"
area = "wiki"
design_id = "X46"
summary = "에이전트 지침·쓰기·점검 규칙·페이지 틀·문법(정의 종류 wiki-rules)을 화면·파일·가져오기로 만든다"
registration = { kind = "definition", name = "wiki-rules" }
interface = "agent_console_contracts.wiki:WikiRulesDefinition"
builtin = "none"
example = { kind = "snippet", note = "위키 규칙 정의 데이터" }
guide = "wiki.md"

[tool.agent-console.extension-points.wiki-syntax]
title = "위키 문법"
area = "wiki"
design_id = "X47"
summary = "링크 패턴·머리말 역할·제목 출처·확장자·링크 스킴·기본 점검 심각도를 데이터로 바꾼다"
registration = { kind = "data", path = "data/default_syntax.yaml", settings = ["wiki.syntax"], disable = ["wiki.include_default_syntax"] }
interface = ["agent_console_contracts.wiki:WikiSyntax", "agent_console_wiki:load_default_syntax"]
builtin = "none"
example = { kind = "snippet", note = "사용자 설정 wiki.syntax 데이터" }
guide = "wiki.md"

[tool.agent-console.extension-points.wiki-search-index]
title = "위키 검색 색인"
area = "wiki"
design_id = "X48"
summary = "위키 검색을 다른 색인 구현으로 바꾼다"
registration = { kind = "entry-point", group = "agent_console_wiki:SEARCH_INDEX_GROUP" }
interface = "agent_console_wiki:WikiSearchIndex"
settings = ["wiki.search_backend", "mod-wiki.search.backend"]
example = [
    { kind = "package", path = "examples/extensions/agent-console-example-wiki-search" },
    { kind = "contract-tests", symbols = ["agent_console_wiki.testing:WikiSearchContractTests"] },
]
guide = "wiki.md"

[tool.agent-console.extension-points.wiki-history]
title = "페이지 기록 저장소"
area = "wiki"
design_id = "X49"
summary = "위키 페이지 기록을 다른 저장소에 둔다"
registration = { kind = "injection" }
interface = "agent_console_wiki:WikiHistory"
builtin = "none"
example = { kind = "contract-tests", symbols = ["agent_console_wiki.testing:WikiHistoryContractTests"] }
guide = "wiki.md"
