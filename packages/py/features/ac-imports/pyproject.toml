[project]
name = "agent-console-imports"
version = "0.1.0"
description = "Agent Console — imports definitions by copying them from external settings (~/.claude, project .claude/); sources are read-only"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-numbered-id>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-claude-format>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
]

[project.entry-points."agent_console.import_sources"]
claude = "agent_console_imports.claude:claude_sources"

[project.entry-points."agent_console.message_catalogs"]
ac-imports = "agent_console_imports"

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "agent-console-store>=0.2,<0.3",
]

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs). 이 패키지가 정의한 지점.
[tool.agent-console.extension-points.import-source]
title = "Import source"
area = "transfer"
design_id = "X16"
summary = "Adds a source (factory) that reads outside settings or files and imports them as definitions"
registration = { kind = "entry-point", group = "agent_console_imports:IMPORT_SOURCES_GROUP" }
interface = ["agent_console_imports:ImportSource", "agent_console_imports:ImportSourceFactory", "agent_console_imports:ImportItem"]
example = { kind = "package", path = "examples/extensions/agent-console-example-transfer" }
guide = "transfer.md"
