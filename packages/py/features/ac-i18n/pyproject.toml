[project]
name = "agent-console-i18n"
version = "0.1.0"
description = "Agent Console — message catalogs: per-language JSON format, loading, merging, lookup and checks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.message-catalog]
title = "Message catalog"
area = "i18n"
summary = "Adds translations of server messages, errors, issue codes, and web namespaces as per-language JSON files inside a package"
registration = { kind = "entry-point", group = "agent_console_i18n:MESSAGE_CATALOGS_GROUP" }
interface = ["agent_console_i18n:read_catalog", "agent_console_i18n:package_catalogs", "agent_console_i18n:CatalogSet"]
builtin = "none"
example = [
    { kind = "snippet", note = "Register a package that has `locales/<lang>.json` as an entry point" },
    { kind = "contract-tests", symbols = ["agent_console_i18n.testing:make_catalog_package", "agent_console_i18n.testing:make_distribution"] },
]
guide = "i18n.md#message-catalog"
