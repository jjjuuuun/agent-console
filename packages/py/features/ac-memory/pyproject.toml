[project]
name = "agent-console-memory"
version = "0.1.0"
description = "Agent Console — 공유 메모리: 저장소 프로토콜(X31)·메모리 구현, 범위 종류(X29)·접근 판단, 에이전트 도구 묶음(런타임 무관), 비밀 검사"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.12,<0.13",
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
# 하위 모듈 `sqlite`(SQLite 저장소)와 `testing`의 규모 측정 도구. 최상위는 이것 없이 동작한다.
sqlite = ["sqlalchemy>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
