# ac-memory 도구 묶음(MemoryToolkit)의 문구 기본 데이터.
# 도구 이름·설명·결과 머리 줄은 리소스 config(계약 기본값 memory_access_defaults.json)가 정한다.
# 여기는 입력 매개변수 설명, 검색 결과 줄, 실패 문구다. MemoryToolkit(text=...)로 바꿀 수 있다.
# 매개변수 이름(query·scope·tags·limit·key·content·if_version·mode)은 계약 어휘라 바꾸지 않는다.
version: 1
inputs:
  query: 찾을 말. 키·본문·태그에서 찾습니다. 비우면 최근 기록을 돌려줍니다.
  scope: "범위 종류. 생략하면 기본 범위입니다. 고를 수 있는 값: {choices}"
  tags: 모두 붙어 있어야 하는 태그(검색) 또는 붙일 태그(쓰기).
  limit: 돌려줄 최대 개수.
  key: 기록 키. '/'로 나눈 경로 모양입니다(예 결정/api-버전).
  content: 기록 본문.
  if_version: 이 버전일 때만 씁니다. 다르면 충돌로 알려 줍니다.
  mode: replace는 본문을 바꾸고 append는 뒤에 붙입니다.
# 검색 결과 한 줄. {scope_label} {key} {version} {author} {updated_at} {tags} {preview}
search_item: "- {scope_label}:{key} · v{version} · {updated_at} · 태그 [{tags}]\n  {preview}"
search_empty: 찾은 기록이 없습니다.
written: "{scope_label}:{key}에 v{version}로 썼습니다."
deleted: "{scope_label}:{key}를 지웠습니다. 사람은 화면에서 되돌릴 수 있습니다."
truncated: "…(잘림: {limit}자)"
# 실패 문구(코드 → 문장). 결과 앞에 [코드]가 붙는다. {scope_label} {key} {version} {limit}
errors:
  memory.denied: "{scope_label} 범위에서 이 일을 할 권한이 없습니다."
  memory.not_found: "{scope_label}:{key} 기록이 없습니다."
  memory.conflict: "다른 쪽이 먼저 고쳤습니다. 지금 버전은 v{version}입니다. 다시 읽고 쓰세요."
  memory.too_large: "한도를 넘었습니다({limit})."
  memory.secret_rejected: "비밀로 보이는 값이 있어 쓰지 않았습니다. 값을 빼고 다시 쓰세요."
  memory.rate_limited: "이 실행에서 쓸 수 있는 횟수를 넘었습니다."
  memory.scope_unavailable: "{scope_label} 범위는 이 실행에서 쓸 수 없습니다."
  memory.invalid_key: "키나 태그 형식이 틀렸습니다. 빈 마디·'.'·'..'·제어 문자 없이 적으세요."
  error: "요청을 처리하지 못했습니다."
