[project]
name = "agent-console-logs"
version = "0.1.0"
description = "Agent Console — 로그 분석 코어: 출처·분류기 확장 지점(X5·X6), 증분 jsonl 수집, 정규화 이벤트 초안·식별, 색인 프로토콜, 상관·프로젝트 묶기·토큰 창(순수 함수)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.12,<0.13",
    "agent-console-registry>=0.1,<0.2",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0",
]

# 기본 제공 출처·분류기도 entry point로만 등록한다(특별 취급 없음). 이름 = 레지스트리 key = id.
[project.entry-points."agent_console.log_sources"]
normalized-v1 = "agent_console_logs.plugins.normalized:NormalizedV1Source"
mapped-jsonl = "agent_console_logs.plugins.mapped:MappedJsonlSource"

[project.entry-points."agent_console.log_classifiers"]
normalized-v1 = "agent_console_logs.plugins.normalized:NormalizedV1Classifier"
mapped-jsonl = "agent_console_logs.plugins.mapped:MappedJsonlClassifier"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
