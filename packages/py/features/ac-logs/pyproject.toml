[project]
name = "agent-console-logs"
version = "0.2.0"
description = "Agent Console — log analysis core: source and classifier extension points (X5, X6), incremental jsonl collection, normalized event drafts and identity, index protocol, correlation, project grouping, and token windows (pure functions)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16.1,<0.17",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-path-glob>=0.1,<0.2",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0",
]

# 기본 제공 출처·분류기도 entry point로만 등록한다(특별 취급 없음). 이름 = 레지스트리 key = id.
[project.entry-points."agent_console.log_sources"]
normalized-v1 = "agent_console_logs.plugins.normalized:NormalizedV1Source"
mapped-jsonl = "agent_console_logs.plugins.mapped:MappedJsonlSource"

[project.entry-points."agent_console.log_classifiers"]
normalized-v1 = "agent_console_logs.plugins.normalized:NormalizedV1Classifier"
mapped-jsonl = "agent_console_logs.plugins.mapped:MappedJsonlClassifier"

[project.entry-points."agent_console.message_catalogs"]
ac-logs = "agent_console_logs"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs). 이 패키지가 정의한 지점.
[tool.agent-console.extension-points.log-source]
title = "Log source"
area = "logs"
design_id = "X5"
summary = "Adds a source that reads a new log format (files or folders) into the index"
registration = { kind = "entry-point", group = "agent_console_logs:LOG_SOURCES_GROUP" }
interface = ["agent_console_logs:LogSource", "agent_console_logs:LogSourceContext", "agent_console_logs:RawRecord"]
example = { kind = "package", path = "examples/extensions/agent-console-example-log-source" }
guide = "logs.md"

[tool.agent-console.extension-points.log-classifier]
title = "Log classifier"
area = "logs"
design_id = "X6"
summary = "Adds a classifier that turns raw rows read by a source into normalized log events"
registration = { kind = "entry-point", group = "agent_console_logs:LOG_CLASSIFIERS_GROUP" }
interface = ["agent_console_logs:LogClassifier", "agent_console_logs:ClassifyContext", "agent_console_logs:LogEventDraft"]
example = { kind = "package", path = "examples/extensions/agent-console-example-log-source" }
guide = "logs.md"
