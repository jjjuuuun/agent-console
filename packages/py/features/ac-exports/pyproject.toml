[project]
name = "agent-console-exports"
version = "0.1.0"
description = "Agent Console — 내보내기 확장 지점(X8): 형식 플러그인·레지스트리·보관 파일(zip)·허용 폴더 쓰기 + 기본 형식 claude-dir"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.9,<0.10",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-claude-format>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "jsonschema>=4.23",
]

# 등록은 entry point로. 이름 = 레지스트리 key = 디스크립터 id. 값은 형식 공장(옵션 → Exporter).
[project.entry-points."agent_console.exporters"]
claude-dir = "agent_console_exports.claude_dir:claude_dir_exporter"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
