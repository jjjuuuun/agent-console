[project]
name = "agent-console-delegation-host"
version = "0.1.0"
description = "Agent Console — 독립 위임 방식 host(X12): 대상 노드를 자기 세션·백엔드·설정으로 실행하는 위임 도구"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.12,<0.13",
    "agent-console-runtime>=0.1,<0.2",
    "pydantic>=2.9",
]

# 위임 방식 등록(X12). 이름 = 레지스트리 key = 디스크립터 id.
[project.entry-points."agent_console.delegation_strategies"]
host = "agent_console_delegation_host:HostDelegation"

# 테스트 전용: fake 백엔드·claude-sdk(SDK 목)로 위임 도구 호출을 끝까지 돌린다(패키지 코드는 import하지 않음).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "agent-console-backend-fake-agent>=0.1,<0.2",
    "agent-console-backend-claude-sdk>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
