[project]
name = "agent-console-logs-claude"
version = "0.1.0"
description = "Agent Console — Claude Code 세션 로그 출처(X5 claude-code-jsonl)·분류기(X6 claude-code) 플러그인"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.8,<0.9",
    "agent-console-logs>=0.1,<0.2",
]

# 기본 제공도 entry point로만 등록한다(특별 취급 없음). 이름 = 레지스트리 key = id.
[project.entry-points."agent_console.log_sources"]
claude-code-jsonl = "agent_console_logs_claude:ClaudeCodeJsonlSource"

[project.entry-points."agent_console.log_classifiers"]
claude-code = "agent_console_logs_claude:ClaudeCodeClassifier"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
