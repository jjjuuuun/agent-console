[project]
name = "agent-console-project-space"
version = "0.1.0"
description = "Agent Console — 프로젝트 폴더의 구성 사본 공간: .agent-console/ 정의 저장소, project.yaml 매니페스트, .gitignore 틀, 비밀 저장 거부"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-store>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.portable-definition-kind]
title = "프로젝트 공간에 들어가는 정의 종류"
area = "projects"
design_id = "X36"
summary = "정의 종류를 등록할 때 프로젝트 폴더 사본 공간에 둘 수 있는지 정한다"
registration = { kind = "descriptor", name = "DefinitionKind.portable" }
interface = "agent_console_store:DefinitionKind"
builtin = "none"
example = { kind = "snippet", note = "DefinitionKind(portable=..., library=...)" }
guide = "projects.md"

[tool.agent-console.extension-points.project-space-layout]
title = "프로젝트 폴더 배치·.gitignore 틀"
area = "projects"
design_id = "X37"
summary = "프로젝트 폴더 안 설정 폴더 이름과 .gitignore 기본 틀을 데이터로 바꾼다"
registration = { kind = "data", path = "data/gitignore.template", settings = ["mod-projects.config_dir"] }
interface = "agent_console_project_space:default_gitignore_template"
builtin = "none"
example = { kind = "snippet", note = "설치자 설정 mod-projects.config_dir" }
guide = "projects.md"
