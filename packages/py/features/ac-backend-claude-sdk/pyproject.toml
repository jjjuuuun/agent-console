[project]
name = "agent-console-backend-claude-sdk"
version = "0.1.0"
description = "Agent Console — Claude Agent SDK 실행 백엔드 어댑터"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.8,<0.9",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-runtime>=0.1,<0.2",
    "claude-agent-sdk>=0.2.166",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# observe.hook_probe 감싸기(wrap_command). 없으면 감싸지 않고 경고한다.
hook-probe = ["agent-console-hook-probe>=0.1,<0.2"]

[project.entry-points."agent_console.backends"]
claude-agent-sdk = "agent_console_backend_claude_sdk:ClaudeSdkBackend"

[project.entry-points."agent_console.collectors"]
sdk-hooks = "agent_console_backend_claude_sdk.collectors:SdkHooksCollector"
mcp-calls = "agent_console_backend_claude_sdk.collectors:McpCallsCollector"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "agent-console-backend-fake>=0.1,<0.2",
    "agent-console-hook-probe>=0.1,<0.2",
    "agent-console-trace>=0.1,<0.2",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
