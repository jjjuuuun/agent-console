[project]
name = "agent-console-modkit"
version = "0.1.0"
description = "Agent Console — 서버 모듈 키트: Module·포트·모듈 이벤트·조립·보고, 호스트(보안·토큰·/health·WS 다중화, extra [host]), 단독 실행"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-registry>=0.1,<0.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# 호스트(보안 미들웨어·토큰·/health·WS 다중화·create_host_app)와 standalone 단독 실행
host = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "ruamel-yaml>=0.18",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs). 이 패키지가 정의한 지점.
[tool.agent-console.extension-points.server-module]
title = "서버 모듈"
area = "host"
design_id = "X20"
summary = "REST·WebSocket·설정·DB 계보를 가진 새 기능(또는 두 기능을 잇는 연동)을 서버에 더한다"
registration = { kind = "entry-point", group = "agent_console_modkit:MODULES_GROUP" }
interface = ["agent_console_modkit:Module", "agent_console_modkit:ModuleDescriptor", "agent_console_modkit:ModuleContext", "agent_console_modkit:SettingsCompat"]
example = [
    { kind = "package", path = "examples/extensions/agent-console-example-module" },
    { kind = "contract-tests", symbols = ["agent_console_modkit.testing:echo_module", "agent_console_modkit.testing:fake_module"] },
]
guide = "host.md"

[tool.agent-console.extension-points.migration-scope]
title = "모듈 계보 범위"
area = "host"
design_id = "X39"
summary = "모듈의 DB 계보를 앱 DB·프로젝트 기록 DB 중 어디에 올릴지 정한다"
registration = { kind = "descriptor", name = "MigrationBranch.scopes" }
interface = ["agent_console_modkit:MigrationBranch"]
builtin = "none"
example = { kind = "package", path = "examples/extensions/agent-console-example-module" }
guide = "host.md"

[tool.agent-console.extension-points.definition-kind-contribution]
title = "정의 종류 기여"
area = "host"
design_id = "X44"
summary = "서버 모듈이 새 정의 종류(검증·참조·프로젝트 공간 포함 여부)를 정의 저장소에 더한다"
registration = { kind = "port", port = "agent_console_modkit:DEFINITION_KIND_CONTRIBUTIONS" }
interface = ["agent_console_modkit:KindContribution", "agent_console_modkit:KindReferences"]
example = { kind = "package", path = "examples/extensions/agent-console-example-module" }
guide = "host.md"

[tool.agent-console.extension-points.host-registries]
title = "호스트 레지스트리 묶음"
area = "host"
design_id = "X17"
summary = "호스트가 플러그인을 담을 레지스트리 묶음을 만드는 공장을 바꾼다"
registration = { kind = "entry-point", group = "agent_console_modkit:HOST_REGISTRIES_GROUP" }
interface = ["agent_console_modkit:RegistryBundle", "agent_console_modkit:ExtensionRegistries"]
example = { kind = "reference", path = "packages/py/modules/ac-mod-runs", note = "plugins.create_registries — 실행 레지스트리 묶음" }
guide = "host.md"

[tool.agent-console.extension-points.host-plugin-loader]
title = "호스트 플러그인 로더"
area = "host"
design_id = "X18"
summary = "서버 시작 때 레지스트리 묶음에 자기 확장 지점의 플러그인을 로드한다"
registration = { kind = "entry-point", group = "agent_console_modkit:HOST_PLUGIN_LOADERS_GROUP" }
interface = ["agent_console_modkit:PluginLoader", "agent_console_modkit:PluginLoadContext"]
example = { kind = "contract-tests", symbols = ["agent_console_modkit.testing:example_plugin_loader"] }
guide = "host.md"

[tool.agent-console.extension-points.host-database]
title = "호스트 DB 공장"
area = "host"
design_id = "X19"
summary = "호스트가 쓰는 DB 핸들(계보 실행·엔진)을 만드는 공장을 바꾼다"
registration = { kind = "entry-point", group = "agent_console_modkit:HOST_DATABASE_GROUP" }
interface = ["agent_console_modkit:DatabaseHandle"]
example = { kind = "contract-tests", symbols = ["agent_console_modkit.testing:open_recording_database"] }
guide = "host.md"
