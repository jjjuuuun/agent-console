[project]
name = "agent-console-link-projects-records"
version = "0.1.0"
description = "Agent Console — projects and records link module: opens the records DB in a project folder, brings its lineage up to date, and gives it to the runs and chat modules"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "agent-console-project-space>=0.1,<0.2",
    "agent-console-runtime>=0.1,<0.2",
    "pydantic>=2.9",
]

[project.entry-points."agent_console.server_modules"]
link-projects-records = "agent_console_link_projects_records.module:module"

[project.entry-points."agent_console.message_catalogs"]
ac-link-projects-records = "agent_console_link_projects_records"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "agent-console-mod-runs>=0.1,<0.2",
    "agent-console-mod-chat>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console]
internal-ports = [
    { port = "agent_console_link_projects_records.ports:RECORDS_SPACES", reason = "Inter-module port through which the projects link module gives feature modules the project records database for a space name (this link module is the only implementation)" },
    { port = "agent_console_link_projects_records.ports:RECORDS_SESSIONS", reason = "Inter-module port through which the chat module receives the session resume state of a project records space. Session archiving for a new backend is the `backend-session-archive` extension point" },
]
