[project]
name = "agent-console-link-runs-teams"
version = "0.1.0"
description = "Agent Console — 실행·팀 연동 모듈: 팀 규칙 검증·실행 준비·노드 서비스, 팀 구성 검증 요약·검증 경로"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.9,<0.10",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-runtime>=0.1,<0.2",
    "agent-console-teams>=0.1,<0.2",
    "agent-console-resources>=0.1,<0.2",
    "agent-console-nodes-core>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
link-runs-teams = "agent_console_link_runs_teams.module:module"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-mod-runs>=0.1,<0.2",
    "agent-console-mod-definitions>=0.1,<0.2",
    "agent-console-mod-resources>=0.1,<0.2",
    "agent-console-backend-fake-agent>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
