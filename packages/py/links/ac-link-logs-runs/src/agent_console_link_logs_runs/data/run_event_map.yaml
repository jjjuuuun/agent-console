# 플랫폼 실행 이벤트(RunEvent.type) → 로그 이벤트 대응표(기본 데이터, design §4R.2).
# 설정 `logs.sources[id=platform-runs].config.event_map`이 키(형식)별로 통째로 덮어쓴다.
# 이 파일을 비우거나 지워도 동작한다(모든 형식이 범주 other).
#
# 키: 형식 이름 또는 글롭(`*`·`?`). 정확한 이름이 먼저, 그다음 글롭은 긴 것부터 본다.
# 값(모두 선택):
#   category·title·stage·status·tool·call_id·via·model·message_id·role:
#     문자열 틀(`{/JSON 포인터}`(이벤트 기준)·`{type}`·`{node}`·`{parent_node}`·`{thread}`·`{actor}`·`{run_id}`)
#     또는 `{pointer: /a/b, map: {원래 값: 바꿀 값}, default: 값}`(값은 문자열로 비교: true·false·null·숫자,
#     바꿀 값·default도 틀)
#   from·to: 위와 같은 틀 또는 조건부 값(비면 없음)
#   tags: 태그 목록(`tool` = 도구 호출 약속 태그 — 같은 호출이 한 번만 색인된다)
#   correlation: 근거 이름 → 문자열 틀(session·call_id 근거는 값이 있으면 자동으로 붙는다)
#   duration_ms: 포인터. 값이 있으면 끝난 구간으로 보고 시작(시각 = ts − 소요, 근거 inferred)·끝 두 이벤트를 낸다
#   session_from: 포인터. 이 이벤트가 그 노드의 세션 id를 알린다(그 뒤 그 노드·하위 노드 이벤트의 session)
#   cwd_from: 포인터. 이 이벤트가 Run의 작업 폴더를 알린다(이 이벤트와 그 뒤 같은 Run 이벤트의 cwd → 로그 프로젝트 묶기)
#   usage: 토큰 항목(input_tokens·output_tokens·cache_read_input_tokens·cache_creation_input_tokens) → 포인터
#     기본 대응표는 쓰지 않는다 — 같은 세션을 Claude Code 세션 로그 출처로도 읽으면 토큰이 두 번 세어진다.
#     실행 단위 토큰을 켜려면(C3, README "실행 단위 토큰") 설정 event_map에서 agent.usage 규칙을 통째로 바꿔
#     usage: {input_tokens: /payload/usage/input_tokens, output_tokens: /payload/usage/output_tokens, ...}를 넣는다.
#   skip: true면 색인하지 않는다
types:
  "*": {category: other, title: "{type}"}

  "run.*": {category: system, title: "실행 {/payload/status}"}
  # 실행 준비가 정한 Run 유효 작업 폴더(payload `cwd`, 실행·팀 연동이 싣는다)를 이 Run 이벤트의 cwd로.
  run.started: {category: system, title: "실행 {/payload/status}", cwd_from: /payload/cwd}
  run.failed: {category: error, status: error, title: "실행 실패 {/payload/error/message}"}
  run.reply: {category: llm, title: "{/payload/text}"}

  # run.child_*는 `run.` 접두지만 부모 Run 상태가 아니다(`status` = 자식 Run 상태, design §5R.9).
  run.child_started:
    category: agent
    stage: start
    title: "자식 실행 시작 {/payload/node_id} → {/payload/graph_id}"
    call_id: "{/payload/child_run_id}"
    correlation: {child_run: "{/payload/child_run_id}"}
  run.child_finished:
    category: agent
    stage: complete
    title: "자식 실행 {/payload/node_id} {/payload/status}"
    call_id: "{/payload/child_run_id}"
    status: {pointer: /payload/status, map: {completed: ok, failed: error, interrupted: error}}
    correlation: {child_run: "{/payload/child_run_id}"}

  # 호출 NodeRun의 node.* payload `tool_use_id`(위임 도구 호출 id, C7)를 근거로 옮긴다 —
  # 위임자의 도구 호출(agent.tool_call의 call_id)과 대상 실행이 명시 id로 이어진다.
  "node.*":
    category: agent
    title: "{node} {/payload/status}"
    correlation: {tool_use_id: "{/payload/tool_use_id}"}
  node.failed:
    category: error
    status: error
    title: "{node} 실패 {/payload/error/message}"
    correlation: {tool_use_id: "{/payload/tool_use_id}"}
  # 위임자가 부른 호출 NodeRun(payload `call`, 경로 = 위임자 경로 + 대상)은 시작이 넘김이다.
  # 스케줄 실행(`call` 없음)은 from·to·via를 모두 비워 넘김으로 세지 않는다(C7: to도 호출일 때만).
  node.started:
    category: agent
    title: "{node} {/payload/status}"
    from: {pointer: /payload/call, map: {"null": ""}, default: "{parent_node}"}
    to: {pointer: /payload/call, map: {"null": ""}, default: "{node}"}
    via: {pointer: /payload/call, map: {"null": ""}, default: delegate}
    correlation: {tool_use_id: "{/payload/tool_use_id}"}
  edge.traversed:
    category: handoff
    title: "{/payload/source/node} → {/payload/target/node}"
    from: "{/payload/source/node}"
    to: "{/payload/target/node}"
    via: "{/payload/kind}"
  edge.skipped:
    category: control
    title: "{/payload/source/node} ↛ {/payload/target/node} {/payload/reason}"
  loop.iteration:
    category: control
    title: "반복 {/payload/iteration}회차 ({/payload/edge_id})"
  loop.exhausted:
    category: control
    status: warning
    title: "반복 한도 {/payload/iteration}/{/payload/max_iterations} ({/payload/edge_id})"

  agent.session_started:
    category: system
    title: "세션 시작 {/payload/session_id}"
    model: "{/payload/model}"
    session_from: /payload/session_id
  agent.text_delta: {skip: true}
  agent.message:
    category: llm
    title: "{/payload/text}"
    role: "{/payload/role}"
    message_id: "{/payload/message_id}"
  # 맥락 구성(C1): 붙은 리소스 표지·조각 수만(본문 없음). 리소스 목록은 detail(payload)에 있다.
  agent.context_prepared:
    category: context
    title: "맥락 구성"
  agent.tool_call:
    category: tool_call
    stage: start
    title: "{/payload/name} 호출"
    tool: "{/payload/name}"
    call_id: "{/payload/tool_use_id}"
    tags: [tool]
  agent.tool_result:
    category: tool_result
    stage: complete
    title: "{/payload/output_preview}"
    call_id: "{/payload/tool_use_id}"
    status: {pointer: /payload/is_error, map: {"true": error}, default: ok}
    tags: [tool]
  agent.subagent_started:
    category: handoff
    stage: start
    title: "위임 {/payload/name}"
    call_id: "{/payload/subagent_id}"
    from: "{parent_node}"
    to: "{node}"
    via: delegate
    correlation: {tool_use_id: "{/payload/tool_use_id}"}
  agent.subagent_stopped:
    category: agent
    stage: complete
    title: "위임 끝 {/payload/name} {/payload/status}"
    call_id: "{/payload/subagent_id}"
    status: "{/payload/status}"
    correlation: {tool_use_id: "{/payload/tool_use_id}"}
  # 모델 호출 소요(C2): 백엔드가 아는 값(payload duration_ms)이 있을 때만 시작(inferred)·끝 두 이벤트.
  agent.usage:
    category: usage
    title: "사용량"
    model: "{/payload/model}"
    duration_ms: /payload/duration_ms
  usage.rate_limit: {category: usage, title: "사용 한도 {/payload/window} {/payload/status}"}

  "interaction.*": {category: control, title: "{type}"}
  log.warning: {category: system, status: warning, title: "{/payload/message}"}

  "hook.*": {category: hook, title: "hook {/payload/event}"}
  hook.started:
    category: hook
    title: "hook 시작 {/payload/event} {/payload/name}"
    correlation: {tool_use_id: "{/payload/tool_use_id}"}
  hook.finished:
    category: hook
    title: "hook {/payload/event} {/payload/name}"
    duration_ms: /payload/duration_ms
    status: {pointer: /payload/exit_code, map: {"0": ok, "2": block}, default: error}

  "mcp.*": {category: mcp, title: "MCP {type}"}
  mcp.server_status: {category: mcp, title: "MCP 서버 상태"}
  # 서버 이름(C4)을 근거 mcp_server로 — Claude Code 출처(mcp_tool_pattern)와 같은 키.
  mcp.call_started:
    category: mcp
    stage: start
    title: "MCP {/payload/server}/{/payload/tool}"
    tool: "mcp__{/payload/server}__{/payload/tool}"
    call_id: "{/payload/tool_use_id}"
    correlation: {mcp_server: "{/payload/server}"}
  mcp.call_completed:
    category: mcp
    stage: complete
    title: "MCP {/payload/server}/{/payload/tool}"
    tool: "mcp__{/payload/server}__{/payload/tool}"
    call_id: "{/payload/tool_use_id}"
    status: {pointer: /payload/is_error, map: {"true": error}, default: ok}
    correlation: {mcp_server: "{/payload/server}"}
