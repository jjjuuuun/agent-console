[project]
name = "agent-console-link-logs-runs"
version = "0.1.0"
description = "Agent Console — logs and runs link module: platform run events → logs (runtime source platform-runs), run session logs (/runs/{id}/logs)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-logs>=0.1,<0.2",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
link-logs-runs = "agent_console_link_logs_runs.module:module"

[project.entry-points."agent_console.config_schemas"]
log-source-platform-runs = "agent_console_link_logs_runs.source:SOURCE_SCHEMA"

[project.entry-points."agent_console.message_catalogs"]
ac-link-logs-runs = "agent_console_link_logs_runs"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-mod-logs>=0.1,<0.2",
    "agent-console-mod-runs>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "agent-console-backend-fake-agent>=0.1,<0.2",
    "agent-console-runtime>=0.1,<0.2",
    "agent-console-mod-definitions>=0.1,<0.2",
    "agent-console-link-runs-teams>=0.2,<0.3",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점이 아닌 entry point 그룹(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-groups = [
    { group = "agent_console.config_schemas", reason = "Development-only list that tells repository tools (the settings schema label check) about the settings schemas of runtime sources. The server does not read it" },
]
