[project]
name = "agent-console-link-logs-usage"
version = "0.1.0"
description = "로그·사용량 연동 모듈: 로컬 로그 토큰 추정 창(local-logs 사용량 출처)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.9,<0.10",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-logs>=0.1,<0.2",
    "agent-console-usage>=0.1,<0.2",
    "pydantic>=2.9",
]

[project.entry-points."agent_console.server_modules"]
link-logs-usage = "agent_console_link_logs_usage.module:module"

[project.entry-points."agent_console.config_schemas"]
usage-source-local-logs = "agent_console_link_logs_usage.estimate:CONFIG_SCHEMA"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20261006",
    "agent-console-mod-logs>=0.1,<0.2",
    "agent-console-mod-usage>=0.1,<0.2",
    "agent-console-logs-claude>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
