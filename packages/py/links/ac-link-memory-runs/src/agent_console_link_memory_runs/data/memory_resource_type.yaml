# 리소스 종류 `memory`(에이전트 메모리 접근, design §5.7R.1.3) — 패키지 데이터.
#
# - `id`는 entry point `agent_console.resource_types`의 이름과 같아야 한다(리소스 정의의 `type`).
# - `contributes`의 첫 칸이 실행 묶음 칸 이름이다. 메모리 도구 공급자가 이 칸을 읽고 소비한다.
#   공급자가 없으면(메모리 모듈 꺼짐) 칸이 백엔드로 넘어가 "적용하지 못한 칸" 경고(R13.5)가 난다.
# - `config_schema`는 여기 두지 않는다. 계약 `MemoryAccessConfig`의 JSON Schema를 코드가 채운다
#   (범위 종류 칸은 계약의 `x-ui` 위젯 `memory-scope-kind`).
id: memory
version: 1
title: 메모리 접근
description: 에이전트에게 공유 메모리 도구(검색·읽기·쓰기·지우기)를 주고 범위마다 권한을 정합니다.
combine: append
contributes: [memory]
ui_hints: {icon: 기}
