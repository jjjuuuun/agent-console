[project]
name = "agent-console-link-projects-runs"
version = "0.1.0"
description = "Agent Console — 프로젝트·실행 연동 모듈: 실행의 project_id로 프로젝트 설정 층·작업 폴더를 넣는다"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.12,<0.13",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-projects>=0.1,<0.2",
    "agent-console-teams>=0.1,<0.2",
    "agent-console-runtime>=0.1,<0.2",
    "agent-console-nodes-core>=0.1,<0.2",
    "pydantic>=2.9",
]

[project.entry-points."agent_console.server_modules"]
link-projects-runs = "agent_console_link_projects_runs.module:module"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-mod-runs>=0.1,<0.2",
    "agent-console-mod-projects>=0.1,<0.2",
    "agent-console-mod-definitions>=0.1,<0.2",
    "agent-console-link-runs-teams>=0.1,<0.2",
    "agent-console-link-definitions-teams>=0.1,<0.2",
    "agent-console-backend-fake-agent>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
