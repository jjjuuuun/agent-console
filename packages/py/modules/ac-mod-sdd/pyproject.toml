[project]
name = "agent-console-mod-sdd"
version = "0.2.0"
description = "Agent Console — specs (SDD) feature module: REST /sdd/*, WS sdd.changed, definition kind contributions (document templates, specs), settings section sdd, port sdd.service"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-sdd>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-sdd = "agent_console_mod_sdd.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
sdd = "agent_console_mod_sdd.plugins:load_plugins"

[project.entry-points."agent_console.message_catalogs"]
ac-mod-sdd = "agent_console_mod_sdd"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console]
internal-ports = [
    { port = "agent_console_mod_sdd.ports:SDD_SERVICE", reason = "Service port that the specs module gives link modules (this module is the only implementation)" },
    { port = "agent_console_mod_sdd.ports:SDD_SPACES", reason = "Inter-module port through which the projects link module provides the spec storage for a space name" },
]

[tool.agent-console.extension-points.sdd-verification-source]
title = "Verification source"
area = "sdd"
design_id = "X42"
summary = "Adds, through a plugin or a link module, a source that puts task verification results (test reports and so on) into the trace table"
registration = { kind = "entry-point", group = "agent_console_mod_sdd:VERIFICATION_SOURCES_GROUP", port = "agent_console_mod_sdd.ports:SDD_VERIFICATION_SOURCES" }
interface = "agent_console_sdd:VerificationSource"
example = [
    { kind = "package", path = "examples/extensions/agent-console-example-sdd-junit" },
    { kind = "reference", path = "packages/py/links/ac-link-runs-sdd" },
]
guide = "sdd.md"

[tool.agent-console.extension-points.sdd-task-integration]
title = "Task integration"
area = "sdd"
design_id = "X43"
summary = "Attaches actions, links, issues, and auto-advance to spec tasks (for example, runs or an external issue tracker)"
registration = { kind = "port", port = "agent_console_mod_sdd.ports:SDD_INTEGRATIONS" }
interface = ["agent_console_sdd:TaskIntegration", "agent_console_sdd:ProfileChecker", "agent_console_sdd:TaskIssueSource", "agent_console_sdd:AutomationControl"]
example = { kind = "reference", path = "packages/py/links/ac-link-runs-sdd" }
guide = "sdd.md"
