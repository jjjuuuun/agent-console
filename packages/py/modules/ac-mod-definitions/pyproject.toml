[project]
name = "agent-console-mod-definitions"
version = "0.1.0"
description = "Agent Console — 정의 기능 모듈: 에이전트·팀 구성·공통 설정 저장소와 CRUD, 워크스페이스 설정·비밀 규칙 포트, 평문 점검"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "agent-console-graph>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-definitions = "agent_console_mod_definitions.module:module"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-imports>=0.1,<0.2",
    "agent-console-mod-exports>=0.1,<0.2",
    "agent-console-mod-imports>=0.1,<0.2",
    "agent-console-mod-usage>=0.1,<0.2",
    "agent-console-mod-versions>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "definitions.save_warnings", reason = "정의 모듈이 저장 응답의 평문 비밀 경고 계산을 리소스 모듈에 주는 모듈 사이 통로(구현은 이 모듈 하나)" },
    { port = "definitions.lookup", reason = "정의 모듈이 다른 기능 모듈·연동에 주는 정의 읽기 통로(구현은 이 모듈 하나). 저장소를 바꾸는 확장은 definition-store 지점" },
    { port = "definitions.store", reason = "정의 모듈이 다른 기능 모듈에 주는 정의 저장소 통로(구현은 이 모듈 하나). 저장소를 바꾸는 확장은 definition-store 지점" },
    { port = "definitions.spaces", reason = "프로젝트 모듈이 공간 이름 → 정의 저장소를 기능 모듈에 주는 모듈 사이 통로" },
    { port = "definitions.checks", reason = "기능 모듈·연동이 저장 전 정의 검사를 정의 모듈에 보태는 모듈 사이 다중 통로. 새 정의 종류의 검사는 definition-kind-contribution 지점" },
    { port = "definitions.dependencies", reason = "팀 구성 연동이 정의 사이 의존을 계산해 주는 모듈 사이 통로(구현은 그 연동 하나)" },
    { port = "definitions.usages", reason = "팀 구성 연동이 정의가 붙은 곳을 리소스 모듈에 주는 모듈 사이 통로(구현은 그 연동 하나)" },
    { port = "graphs.entry_labels", reason = "팀 구성 연동이 팀 구성 입구 이름을 정의 모듈에 주는 모듈 사이 통로" },
    { port = "graphs.session_summary", reason = "팀 구성 연동이 목록용 세션 집계를 정의 모듈에 주는 모듈 사이 통로" },
    { port = "graphs.validation", reason = "실행-팀 구성 연동이 목록용 검증 요약을 정의 모듈에 주는 모듈 사이 통로" },
    { port = "secrets.rules", reason = "정의 모듈이 지금 비밀 의심 규칙(사용자 설정)을 다른 모듈에 나눠 주는 통로. 비밀 값 출처를 더하는 확장은 secret-provider 지점" },
    { port = "workspace.settings", reason = "정의 모듈이 지금 워크스페이스 설정을 다른 모듈에 나눠 주는 통로(구현은 이 모듈 하나)" },
]
