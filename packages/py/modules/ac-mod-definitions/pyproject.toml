[project]
name = "agent-console-mod-definitions"
version = "0.1.0"
description = "Agent Console — 정의 기능 모듈: 에이전트·팀 구성·공통 설정 저장소와 CRUD, 워크스페이스 설정·비밀 규칙 포트, 평문 점검"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "agent-console-graph>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-definitions = "agent_console_mod_definitions.module:module"

[project.entry-points."agent_console.message_catalogs"]
ac-mod-definitions = "agent_console_mod_definitions"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-imports>=0.1,<0.2",
    "agent-console-mod-exports>=0.1,<0.2",
    "agent-console-mod-imports>=0.1,<0.2",
    "agent-console-mod-usage>=0.1,<0.2",
    "agent-console-mod-versions>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "definitions.save_warnings", reason = "Inter-module port through which the definitions module gives the resources module the plaintext secret warnings for save responses (this module is the only implementation)" },
    { port = "definitions.lookup", reason = "Definition read port that the definitions module gives other feature modules and link modules (this module is the only implementation). To replace the store, use the `definition-store` extension point" },
    { port = "definitions.store", reason = "Definition store port that the definitions module gives other feature modules (this module is the only implementation). To replace the store, use the `definition-store` extension point" },
    { port = "definitions.spaces", reason = "Inter-module port through which the projects module gives feature modules the definition store for a space name" },
    { port = "definitions.checks", reason = "Inter-module multi-provider port through which feature modules and link modules add pre-save definition checks to the definitions module. Checks for a new definition kind use the `definition-kind-contribution` extension point" },
    { port = "definitions.dependencies", reason = "Inter-module port through which the teams link module computes dependencies between definitions (that link module is the only implementation)" },
    { port = "definitions.usages", reason = "Inter-module port through which the teams link module tells the resources module where a definition is used (that link module is the only implementation)" },
    { port = "graphs.entry_labels", reason = "Inter-module port through which the teams link module gives the definitions module the entry names of teams" },
    { port = "graphs.session_summary", reason = "Inter-module port through which the teams link module gives the definitions module session totals for lists" },
    { port = "graphs.validation", reason = "Inter-module port through which the runs and teams link module gives the definitions module validation summaries for lists" },
    { port = "secrets.rules", reason = "Port through which the definitions module shares the current secret detection rules (user settings) with other modules. To add a place to look up secret values, use the `secret-provider` extension point" },
    { port = "workspace.settings", reason = "Port through which the definitions module shares the current workspace settings with other modules (this module is the only implementation)" },
]
