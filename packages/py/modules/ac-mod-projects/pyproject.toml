[project]
name = "agent-console-mod-projects"
version = "0.2.0"
description = "Agent Console — 프로젝트 기능 모듈: 폴더 등록·폴더 고르기·프로젝트 구성 공간·공간 사이 복사"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-local-folders>=0.1,<0.2",
    "agent-console-project-space>=0.1,<0.2",
    "agent-console-projects>=0.2,<0.3",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-projects = "agent_console_mod_projects.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
projects = "agent_console_mod_projects.plugins:load_plugins"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console]
internal-ports = [
    { port = "agent_console_mod_projects.ports:PROJECTS_LOOKUP", reason = "프로젝트 모듈이 연동 모듈에 주는 읽기 통로(구현은 이 모듈 하나)" },
    { port = "agent_console_mod_projects.ports:PROJECT_FOLDERS", reason = "등록된 프로젝트 폴더를 다른 기능 모듈에 주는 통로(구현은 이 모듈 하나)" },
    { port = "agent_console_mod_projects.ports:PROJECTS_SPACES", reason = "프로젝트 공간을 연동 모듈에 여는 통로(구현은 이 모듈 하나)" },
]

[tool.agent-console.extension-points.definition-references]
title = "정의 참조 추출"
area = "projects"
design_id = "X25"
summary = "정의 문서가 쓰는 다른 정의를 알려 복사 계획·범위 검사의 참조 닫힘에 넣는다"
registration = { kind = "port", port = "agent_console_mod_projects.ports:DEFINITIONS_REFERENCES" }
interface = "agent_console_mod_projects.ports:References"
example = { kind = "reference", path = "packages/py/links/ac-link-definitions-teams" }
guide = "projects.md"

[tool.agent-console.extension-points.definition-reference-rewriter]
title = "정의 참조 고치기"
area = "projects"
design_id = "X25"
summary = "이름을 바꿔 복사할 때 정의 문서 안의 참조를 새 이름으로 고친다"
registration = { kind = "port", port = "agent_console_mod_projects.ports:DEFINITIONS_REWRITERS" }
interface = "agent_console_projects:RewriteReferences"
example = { kind = "snippet", note = "참조 고치기 함수 하나를 포트로 제공" }
guide = "projects.md"

[tool.agent-console.extension-points.folder-dialog-provider]
title = "폴더 선택 창 제공자"
area = "projects"
design_id = "X35"
summary = "운영체제 폴더 선택 창을 명령 데이터나 코드 제공자로 더한다"
registration = { kind = "entry-point", group = "agent_console_mod_projects:FOLDER_DIALOGS_GROUP" }
interface = "agent_console_mod_projects:FolderDialogProvider"
settings = ["mod-projects.folder_dialog.providers", "mod-projects.folder_dialog.include_default_providers"]
example = [
    { kind = "reference", path = "packages/py/features/ac-local-folders", note = "명령 표 데이터 data/folder_dialogs.json" },
    { kind = "snippet", note = "코드 제공자" },
]
guide = "projects.md"
