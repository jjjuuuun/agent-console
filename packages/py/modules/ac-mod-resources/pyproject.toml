[project]
name = "agent-console-mod-resources"
version = "0.1.0"
description = "Agent Console — 리소스 기능 모듈: 리소스 라이브러리 CRUD·본문·여러 파일, 리소스 종류 목록, 리소스 조회·종류 포트"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-resources>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-resources = "agent_console_mod_resources.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
resources = "agent_console_mod_resources.plugins:load_plugins"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-resources-core>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "resources.lookup", reason = "리소스 모듈이 리소스 정의·본문 조회를 연동 모듈에 주는 통로(구현은 이 모듈 하나)" },
    { port = "resources.types", reason = "리소스 모듈이 등록된 리소스 종류 레지스트리를 연동 모듈에 주는 통로. 새 종류는 resource-type 지점" },
]
