[project]
name = "agent-console-mod-logs"
version = "0.1.0"
description = "Agent Console — logs feature module: source collection schedule, /logs queries, dashboard templates, WS logs, index lineage logs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-logs>=0.2,<0.3",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "fastapi>=0.115",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "alembic>=1.13",
]

[project.entry-points."agent_console.server_modules"]
mod-logs = "agent_console_mod_logs.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
logs = "agent_console_mod_logs.plugins:load_plugins"

[project.entry-points."agent_console.message_catalogs"]
ac-mod-logs = "agent_console_mod_logs"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.log-scope-kind]
title = "Log scope kind"
area = "logs"
design_id = "X27"
summary = "Adds a kind for the log query scope `scope=<kind>:<value>` (a value maps to a set of sessions and runs)"
registration = { kind = "port", port = "agent_console_mod_logs.ports:LOG_SCOPE_KINDS" }
interface = "agent_console_logs:LogScopeKind"
example = { kind = "reference", path = "packages/py/links/ac-link-logs-runs" }
guide = "logs.md"

[tool.agent-console.extension-points.log-filter-predicate]
title = "Log filter extension"
area = "logs"
design_id = "X28"
summary = "Adds a set of new filter names and an event predicate to log queries"
registration = { kind = "port", port = "agent_console_mod_logs.ports:LOG_FILTER_PREDICATES" }
interface = "agent_console_logs:LogFilterExtension"
example = { kind = "reference", path = "packages/py/links/ac-link-logs-architecture" }
guide = "logs.md"

[tool.agent-console.extension-points.runtime-log-source]
title = "Runtime log source"
area = "logs"
design_id = "X5r"
summary = "Lets a link module provide a source that puts another module's data (for example, platform run history) into the log index"
registration = { kind = "port", port = "agent_console_mod_logs.ports:LOG_SOURCES" }
interface = ["agent_console_mod_logs.ports:RuntimeLogSource"]
example = { kind = "reference", path = "packages/py/links/ac-link-logs-runs" }
guide = "logs.md"

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "logs.query", reason = "Port through which the logs module gives link modules read access to the index (this module is the only implementation)" },
    { port = "logs.ingest", reason = "Port through which the logs module gives link modules runtime source collection and collection scheduling (this module is the only implementation)" },
    { port = "logs.source_defaults", reason = "Inter-module port through which link modules tell the logs module whether their own sources are on by default. New sources use the `log-source` and `runtime-log-source` extension points" },
]
