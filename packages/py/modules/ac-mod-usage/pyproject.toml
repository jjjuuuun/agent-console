[project]
name = "agent-console-mod-usage"
version = "0.1.0"
description = "Agent Console — 사용량 기능 모듈: /usage·/usage/sources(parts 부분 조회), 관측값 정리"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "agent-console-usage>=0.1,<0.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-usage = "agent_console_mod_usage.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
usage = "agent_console_mod_usage.plugins:load_plugins"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs). 이 패키지가 정의한 지점.
[tool.agent-console.extension-points.runtime-usage-source]
title = "런타임 사용량 출처"
area = "usage"
design_id = "X13r"
summary = "다른 모듈의 데이터(예: 로그 색인)로 사용량을 계산하는 출처를 연동 모듈이 준다"
registration = { kind = "port", port = "agent_console_mod_usage:USAGE_SOURCES" }
interface = ["agent_console_usage:UsageSource"]
example = { kind = "reference", path = "packages/py/links/ac-link-logs-usage" }
guide = "usage.md"

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "usage.service", reason = "사용량 모듈이 연동 모듈에 존재·보고 서비스를 알리는 통로(구현은 이 모듈 하나)" },
    { port = "usage.event_query", reason = "실행-사용량 연동이 실행 이벤트 조회를 사용량 모듈에 주는 모듈 사이 통로(구현은 그 연동 하나)" },
    { port = "usage.token_rollups", reason = "실행-사용량 연동이 플랫폼 실행분 토큰 집계를 주는 모듈 사이 통로(구현은 그 연동 하나)" },
]
