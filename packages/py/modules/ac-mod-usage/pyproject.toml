[project]
name = "agent-console-mod-usage"
version = "0.1.0"
description = "Agent Console — usage feature module: /usage and /usage/sources (partial queries with parts), observation cleanup"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "agent-console-usage>=0.1,<0.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-usage = "agent_console_mod_usage.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
usage = "agent_console_mod_usage.plugins:load_plugins"

[project.entry-points."agent_console.message_catalogs"]
ac-mod-usage = "agent_console_mod_usage"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs). 이 패키지가 정의한 지점.
[tool.agent-console.extension-points.runtime-usage-source]
title = "Runtime usage source"
area = "usage"
design_id = "X13r"
summary = "Lets a link module provide a source that computes usage from another module's data (for example, the log index)"
registration = { kind = "port", port = "agent_console_mod_usage:USAGE_SOURCES" }
interface = ["agent_console_usage:UsageSource"]
example = { kind = "reference", path = "packages/py/links/ac-link-logs-usage" }
guide = "usage.md"

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "usage.service", reason = "Port through which the usage module tells link modules that it is present and offers its reporting service (this module is the only implementation)" },
    { port = "usage.event_query", reason = "Inter-module port through which the runs and usage link module gives the usage module run event lookup (that link module is the only implementation)" },
    { port = "usage.token_rollups", reason = "Inter-module port through which the runs and usage link module provides token totals for platform runs (that link module is the only implementation)" },
]
