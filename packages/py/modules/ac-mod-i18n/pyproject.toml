[project]
name = "agent-console-mod-i18n"
version = "0.1.0"
description = "Agent Console message catalog module: GET /i18n and /i18n/{lang} from package catalogs and user folders"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-i18n>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-i18n = "agent_console_mod_i18n.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
i18n = "agent_console_mod_i18n.plugins:load_plugins"

[project.entry-points."agent_console.message_catalogs"]
ac-mod-i18n = "agent_console_mod_i18n"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# The tool settings below are generated from the scripts/pkgkit templates. To change them, edit the templates and align with `poe pkg-lint`.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
