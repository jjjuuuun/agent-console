[project]
name = "agent-console-mod-wiki"
version = "0.2.0"
description = "Agent Console — 위키 기능 모듈: REST /wiki/*·WS wiki.changed, 정의 종류 기여(위키·위키 규칙), 설정 섹션 wiki, 포트 wiki.service, 계보 wiki"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16,<0.17",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-wiki[sqlite]>=0.2,<0.3",
    "agent-console-store>=0.2,<0.3",
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "agent-console-safe-zip>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
]

[project.entry-points."agent_console.server_modules"]
mod-wiki = "agent_console_mod_wiki.module:module"

[project.entry-points."agent_console.host_plugin_loaders"]
wiki = "agent_console_mod_wiki.plugins:load_plugins"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console]
internal-ports = [
    { port = "agent_console_mod_wiki.ports:WIKI_SERVICE", reason = "Service port that the wiki module gives link modules (this module is the only implementation)" },
    { port = "agent_console_mod_wiki.ports:WIKI_SPACES", reason = "Inter-module port through which the projects link module provides the wiki storage for a space name" },
    { port = "agent_console_mod_wiki.ports:WIKI_INTEGRATIONS", reason = "Inter-module port that announces the capability names that storage link modules turn on (only names that the wiki module knows have any meaning)" },
]

[tool.agent-console.extension-points.wiki-write-check]
title = "Wiki write check contribution"
area = "wiki"
design_id = "X50"
summary = "Adds, through a plugin or a link module, a check that warns about or rejects a write to a wiki page"
registration = { kind = "entry-point", group = "agent_console_mod_wiki:WRITE_CHECKS_GROUP", port = "agent_console_mod_wiki.ports:WIKI_WRITE_CHECKS" }
interface = "agent_console_wiki:WikiWriteCheck"
settings = ["wiki.write_checks"]
example = { kind = "package", path = "examples/extensions/agent-console-example-wiki-check" }
guide = "wiki.md"
