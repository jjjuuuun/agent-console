[project]
name = "agent-console-mod-runs"
version = "0.1.0"
description = "Agent Console — 실행 기능 모듈: 실행 엔진·Run·이벤트·상호작용 경로, WS run:·interactions, 재시작 복구·이어 가기"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-graph>=0.1,<0.2",
    "agent-console-runtime>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.entry-points."agent_console.server_modules"]
mod-runs = "agent_console_mod_runs.module:module"

[project.entry-points."agent_console.host_registries"]
runs = "agent_console_mod_runs.plugins:create_registries"

[project.entry-points."agent_console.host_plugin_loaders"]
runs = "agent_console_mod_runs.plugins:load_plugins"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-nodes-core>=0.1,<0.2",
    "agent-console-backend-fake-agent>=0.1,<0.2",
    "agent-console-mod-definitions>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.run-scope]
title = "실행 범위"
area = "projects"
design_id = "X26"
summary = "Run마다 노드 서비스·경고·정의 출처·기록 공간을 더한다(예: 요청한 프로젝트의 공간)"
registration = { kind = "port", port = "agent_console_mod_runs.ports:RUN_SCOPES" }
interface = ["agent_console_mod_runs.ports:RunScoper", "agent_console_mod_runs.ports:RunScopeLike", "agent_console_mod_runs.ports:RunDefinitionsScoper", "agent_console_mod_runs.ports:RunChildScoper"]
example = [
    { kind = "package", path = "examples/extensions/agent-console-example-link" },
    { kind = "reference", path = "packages/py/links/ac-link-projects-runs" },
]
guide = "projects.md"

[tool.agent-console.extension-points.run-labels]
title = "실행 라벨"
area = "host"
design_id = "X45"
summary = "Run에 라벨을 달아 다른 기능·스크립트가 자기 실행을 묶고 목록에서 거른다(label= 질의)"
registration = { kind = "field", name = "Run.labels" }
interface = ["agent_console_contracts:Run"]
builtin = "none"
example = { kind = "snippet" }
guide = "host.md"

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "runs.starter", reason = "실행 모듈이 실행 시작·검증·취소를 연동 모듈에 주는 통로(구현은 이 모듈 하나)" },
    { port = "runs.reader", reason = "실행 모듈이 Run·NodeRun 조회를 연동 모듈에 주는 통로(구현은 이 모듈 하나)" },
    { port = "runs.events", reason = "실행 모듈이 실행 이벤트 조회를 연동 모듈에 주는 통로(구현은 이 모듈 하나)" },
    { port = "interactions.port", reason = "실행 모듈이 상호작용 조회·응답을 대화 연동에 주는 통로. 새 상호작용 종류는 interaction-kind 지점" },
    { port = "runs.move_hook", reason = "실행 모듈이 대화 옮기기에 딸린 Run 옮기기 훅을 대화 연동에 주는 통로" },
    { port = "runs.preparers", reason = "팀 구성 연동이 실행 전 검사·준비를 실행 모듈에 보태는 모듈 사이 다중 통로" },
    { port = "runs.services", reason = "연동 모듈이 노드 서비스를 실행 모듈에 보태는 모듈 사이 다중 통로. Run마다 도구를 더하는 확장은 run-scope·agent-tool-provider 지점" },
    { port = "runs.resume_handlers", reason = "대화 연동이 이어 가기 처리기를 실행 모듈에 보태는 모듈 사이 다중 통로" },
    { port = "runs.session_archive", reason = "실행 모듈이 백엔드 id → 세션 기록 보관을 프로젝트 기록 연동에 주는 통로. 새 백엔드의 보관 능력은 backend-session-archive 지점" },
    { port = "secrets.redact", reason = "실행 모듈이 해석한 비밀 값 가리기를 연동 모듈에 주는 통로(구현은 이 모듈 하나)" },
]
