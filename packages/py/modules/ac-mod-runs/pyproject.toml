[project]
name = "agent-console-mod-runs"
version = "0.2.0"
description = "Agent Console — runs feature module: execution engine, Run, event, and interaction routes, WS run: and interactions, restart recovery and continuation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.16.1,<0.17",
    "agent-console-conditions>=0.1,<0.2",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-graph>=0.1,<0.2",
    "agent-console-runtime>=0.2,<0.3",
    "agent-console-secret-rules>=0.1,<0.2",
    "agent-console-store>=0.2,<0.3",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.entry-points."agent_console.server_modules"]
mod-runs = "agent_console_mod_runs.module:module"

[project.entry-points."agent_console.host_registries"]
runs = "agent_console_mod_runs.plugins:create_registries"

[project.entry-points."agent_console.host_plugin_loaders"]
runs = "agent_console_mod_runs.plugins:load_plugins"

[project.entry-points."agent_console.message_catalogs"]
ac-mod-runs = "agent_console_mod_runs"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-nodes-core>=0.1,<0.2",
    "agent-console-backend-fake-agent>=0.2,<0.3",
    "agent-console-mod-definitions>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console.extension-points.run-scope]
title = "Run scope"
area = "projects"
design_id = "X26"
summary = "Adds node services, warnings, definition sources, and a records space to each run (for example, the space of the requesting project)"
registration = { kind = "port", port = "agent_console_mod_runs.ports:RUN_SCOPES" }
interface = ["agent_console_mod_runs.ports:RunScoper", "agent_console_mod_runs.ports:RunScopeLike", "agent_console_mod_runs.ports:RunDefinitionsScoper", "agent_console_mod_runs.ports:RunChildScoper", "agent_console_mod_runs.ports:RunProjectScoper"]
example = [
    { kind = "package", path = "examples/extensions/agent-console-example-link" },
    { kind = "reference", path = "packages/py/links/ac-link-projects-runs" },
]
guide = "projects.md"

[tool.agent-console.extension-points.run-labels]
title = "Run labels"
area = "host"
design_id = "X45"
summary = "Labels runs so that other features and scripts can group their own runs and filter them in lists (the `label=` query)"
registration = { kind = "field", name = "Run.labels" }
interface = ["agent_console_contracts:Run"]
builtin = "none"
example = { kind = "snippet" }
guide = "host.md"

# 확장 지점이 아닌 포트(scripts/extdocs 대조에서 뺀다).
[tool.agent-console]
internal-ports = [
    { port = "runs.starter", reason = "Port through which the runs module gives link modules run start, validation, and cancellation (this module is the only implementation)" },
    { port = "runs.reader", reason = "Port through which the runs module gives link modules Run and NodeRun lookup (this module is the only implementation)" },
    { port = "runs.events", reason = "Port through which the runs module gives link modules run event lookup (this module is the only implementation)" },
    { port = "interactions.port", reason = "Port through which the runs module gives the chat link module interaction lookup and replies. New interaction kinds use the `interaction-kind` extension point" },
    { port = "runs.move_hook", reason = "Port through which the runs module gives the chat link module the hook that moves runs along with a moved conversation" },
    { port = "runs.preparers", reason = "Inter-module multi-provider port through which the teams link module adds pre-run checks and preparation to the runs module" },
    { port = "runs.services", reason = "Inter-module multi-provider port through which link modules add node services to the runs module. To add tools to each run, use the `run-scope` and `agent-tool-provider` extension points" },
    { port = "runs.resume_handlers", reason = "Inter-module multi-provider port through which the chat link module adds resume handlers to the runs module" },
    { port = "runs.session_archive", reason = "Port through which the runs module gives the project records link module the session archive for a backend id. Archiving for a new backend is the `backend-session-archive` extension point" },
    { port = "secrets.redact", reason = "Port through which the runs module gives link modules masking of resolved secret values (this module is the only implementation)" },
]
