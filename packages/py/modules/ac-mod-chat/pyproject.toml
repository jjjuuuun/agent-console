[project]
name = "agent-console-mod-chat"
version = "0.1.0"
description = "Agent Console — 채팅 기능 모듈: 대화·대기열 경로, WS conversation:, 턴·상호작용은 포트로"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.14,<0.15",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-chat>=0.1,<0.2",
    "agent-console-store>=0.1,<0.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "alembic>=1.13",
]

[project.entry-points."agent_console.server_modules"]
mod-chat = "agent_console_mod_chat.module:module"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "agent-console-mod-definitions>=0.1,<0.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]

# 확장 지점 선언(scripts/extdocs/README.md). 문서·대조 도구가 읽는다.
[tool.agent-console]
internal-ports = [
    { port = "agent_console_mod_chat.ports:CHAT_CONVERSATIONS", reason = "대화 모듈이 연동 모듈에 주는 서비스 통로(구현은 이 모듈 하나)" },
    { port = "agent_console_mod_chat.ports:CHAT_TURN_LAUNCHER", reason = "대화-실행 연동이 턴 실행을 붙이는 모듈 사이 통로(구현은 그 연동 하나)" },
    { port = "agent_console_mod_chat.ports:CHAT_RUNS", reason = "대화-실행 연동이 턴 Run 조회를 붙이는 모듈 사이 통로" },
    { port = "agent_console_mod_chat.ports:CHAT_RUN_EVENTS", reason = "대화-실행 연동이 턴 이벤트 조회를 붙이는 모듈 사이 통로" },
    { port = "agent_console_mod_chat.ports:CHAT_INTERACTIONS", reason = "대화-실행 연동이 턴 상호작용 조회를 붙이는 모듈 사이 통로" },
    { port = "agent_console_mod_chat.ports:CHAT_TURN_SESSIONS", reason = "대화-실행 연동이 턴 세션 수집·정리 규칙을 주는 모듈 사이 통로" },
    { port = "agent_console_mod_chat.ports:CHAT_MOVE_HOOKS", reason = "대화 옮기기에 딸린 실행 기록 옮기기를 묶는 모듈 사이 통로(대화-실행 연동이 제공)" },
]
