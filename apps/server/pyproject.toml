[project]
name = "agent-console-server"
version = "0.1.0"
description = "Agent Console 서버 — 설치된 기능 모듈을 모아 HTTP·WebSocket으로 제공"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agent-console-contracts>=0.8,<0.9",
    "agent-console-registry>=0.1,<0.2",
    "agent-console-secret-rules>=0.1,<0.2",
    "agent-console-resources-core>=0.1,<0.2",
    "agent-console-nodes-core>=0.1,<0.2",
    "agent-console-delegation-host>=0.1,<0.2",
    "agent-console-backend-claude-sdk[login]>=0.1,<0.2",
    "agent-console-backend-fake-agent>=0.1,<0.2",
    "agent-console-modkit[host]>=0.1,<0.2",
    "agent-console-mod-usage>=0.1,<0.2",
    "agent-console-mod-imports>=0.1,<0.2",
    "agent-console-mod-exports>=0.1,<0.2",
    "agent-console-mod-versions>=0.1,<0.2",
    "agent-console-mod-definitions>=0.1,<0.2",
    "agent-console-mod-resources>=0.1,<0.2",
    "agent-console-mod-projects>=0.1,<0.2",
    "agent-console-link-projects-runs>=0.1,<0.2",
    "agent-console-link-definitions-resources>=0.1,<0.2",
    "agent-console-link-definitions-teams>=0.1,<0.2",
    "agent-console-link-exports-teams>=0.1,<0.2",
    "agent-console-mod-runs>=0.1,<0.2",
    "agent-console-link-runs-teams>=0.1,<0.2",
    "agent-console-link-runs-trace>=0.1,<0.2",
    "agent-console-link-runs-usage>=0.1,<0.2",
    "agent-console-mod-chat>=0.1,<0.2",
    "agent-console-link-chat-runs>=0.1,<0.2",
    "agent-console-mod-logs>=0.1,<0.2",
    "agent-console-link-logs-trace>=0.1,<0.2",
    "agent-console-logs-claude>=0.1,<0.2",
    "agent-console-hook-probe>=0.1,<0.2",
    "agent-console-link-logs-runs>=0.1,<0.2",
    "agent-console-link-logs-usage>=0.1,<0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "ruamel-yaml>=0.18",
    "pydantic>=2.9",
    "starlette>=0.37",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

# 아래 도구 설정은 scripts/pkgkit 템플릿에서 생성한다. 바꿀 때는 템플릿을 고치고 `poe pkg-lint`로 맞춘다.
[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
addopts = ["--doctest-glob=README.md", "--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["agent_console_*"]
